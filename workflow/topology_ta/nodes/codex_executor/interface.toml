name = "codex_executor"
kind = "agent_scope"
callable_by = ["workflow_lite/bin/spawn_executor.py"]
description = "Run one isolated Codex executor that searches lossless multi-GPU inference topologies."

inputs = ["goal_dir", "goal.md", "frozen_baseline", "model_experiment_worktree"]
outputs = [
  "DELIVERY.json",
  "TOPOLOGY-PREFLIGHT.json",
  "TOPOLOGY-SEARCH-STATE.json",
  "runs/<run-id>/outputs/equivalence.json",
  "runs/<run-id>/outputs/topology_preflight.json",
  "runs/<run-id>/outputs/topology_manifest.json",
  "runs/<run-id>/outputs/topology_trace.json",
]
outcomes = ["complete", "blocked"]
side_effects = ["may_modify_experiment_worktree", "may_submit_slurm_jobs", "may_write_run_artifacts"]
