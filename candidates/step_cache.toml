id = "step_cache"
kind = "methodology"
description = "Cosmos3 diffusion step-cache methodology ported from LTX-2.3 cache experiments."
submodule = "Sol-LTX-Infer"
base_commit = "29d0d9e464000a2472345dcad51054b15aacca8d"
run_script = "scripts/run_cosmos3_sglang.sh"
eval_profile = "evals/profiles/official_video_t2v.toml"

[official_config]
model = "nvidia/Cosmos3-Super"
width = 1280
height = 720
frames = 189
fps = 24
steps = 35
guidance_scale = 6.0
flow_shift = 10.0
max_sequence_length = 4096
seed = 42
num_gpus = 4

[agent]
goal_id = "step_cache"
owner = "codex"
root_branch = "codex/step_cache"
submodule_branch = "codex/step_cache-sol"
interactive_required = true
write_scope = [
  "Sol-LTX-Infer/python/sglang/multimodal_gen/runtime/efficiency/models/cosmos3_spec.py",
  "Sol-LTX-Infer/python/sglang/multimodal_gen/runtime/models/dits/cosmos3video.py",
  "Sol-LTX-Infer/scripts/run_cosmos3_sglang.sh",
]

[env]
MODEL_REPO = "nvidia/Cosmos3-Super"
NUM_GPUS = "4"
SEED = "42"
PROMPT = "A serene mountain lake at sunrise, mist rising off the still water, pine trees reflected on the surface, a small wooden boat drifting slowly, cinematic, high detail"
NEGATIVE_PROMPT = ""
SGLANG_COSMOS3_STEP_CACHE_ENABLED = "0"
SGLANG_COSMOS3_STEP_CACHE_SKIP_STEPS = "16-28"
SGLANG_COSMOS3_STEP_CACHE_DELTA_SCALE = "0.0"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
quality = "quality.json"
risk_notes = "risk_notes.md"
collection = "collection.json"
patch_summary = "patch_summary.md"

[patch]
summary = "Wire StepCache around the Cosmos3 denoise-step loop through the generic efficiency Plan.on_step hook."
touch_points = [
  "python/sglang/multimodal_gen/runtime/efficiency/models/cosmos3_spec.py",
  "python/sglang/multimodal_gen/runtime/models/dits/cosmos3video.py",
  "scripts/run_cosmos3_sglang.sh",
]
off_identity_required = true

[slurm]
account = "nvr_elm_llm"
partition = "batch"
nodes = 1
gpus_per_node = 4
cpus_per_task = 64
mem = "0"
time = "04:00:00"
job_name = "autovideo-step-cache"
exclusive = true
