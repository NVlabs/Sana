# LEGACY FLAT PROFILE — read by scripts/launch_candidate.py (via a candidate's
# model_profile="wan22_t2v_a14b"). Wan2.2-T2V-A14B is a 2-expert MoE (transformer
# + transformer_2); dual guidance via WAN22_GUIDANCE2, expert switch at boundary_ratio.
id = "wan22_t2v_a14b"
spec = "Wan2.2-T2V-A14B"
display_name = "Wan2.2-T2V-A14B 720p81 text-to-video baseline (MoE)"
submodule = "models/wan22_t2v_a14b/baseline"
run_script = "scripts/run_wan22_t2v_a14b_gpu.sh"
eval_profile = "evals/profiles/official_video_t2v_wan22_t2v_a14b.toml"

[official_config]
model = "wan22_t2v_a14b_diffusers"
width = 1280
height = 720
frames = 81
fps = 16
steps = 40
flow_shift = 12.0
guidance_mode = "cfg_moe"
guidance_scale = 4.0
guidance_scale_2 = 3.0
seed = 1024
num_gpus = 4   # whole-node QOS (inference uses 1 GPU; both experts fit in 192GB HBM)

[env]
PYTHON_BIN = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/sparse_attn_training/.venv/bin/python"
WAN22_WEIGHTS = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/pretrained_models/Wan2.2-T2V-A14B-Diffusers"
WAN22_MODEL_LABEL = "wan22_t2v_a14b"
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
TOKENIZERS_PARALLELISM = "false"
WAN22_HEIGHT = "720"
WAN22_WIDTH = "1280"
WAN22_FRAMES = "81"
WAN22_STEPS = "40"
WAN22_GUIDANCE = "4.0"
WAN22_GUIDANCE2 = "3.0"
WAN22_FLOW_SHIFT = "12.0"
WAN22_FPS = "16"
WAN22_SEED = "1024"
WAN22_NUM_PROMPTS = "5"
WAN22_WARMUP_PASSES = "1"
WAN22_VAL_PROMPTS = "models/wan22_t2v_a14b/prompts/t2v_val5.json"

[slurm]
account = "nvr_elm_llm"
partition = "batch"
nodes = 1
gpus_per_node = 4
exclusive = true
cpus_per_task = 64
mem = "0"
time = "02:30:00"
job_name = "wan22_t2v_a14b_baseline"

[baseline]
run_id = "wan14b_4gpu_cp4_baseline"
total_s = 129.01
denoise_s = 122.33
timing_scope = "text_to_video_hot_after_warmup_pass"
num_gpus = 4
parallel = "context_parallel_ulysses4"
measured_on = "GB200 (4-GPU Ulysses CP4), pristine A14B, hot"
note = "Option B 4-GPU baseline: pristine A14B + 4-way Ulysses context-parallel (cp4_ulysses). Candidates must run at 4-GPU CP4 and beat 129.01s via real optimization on top; pure parallelization = this baseline (not a win). prev 1-GPU pristine = 450.84s (runs/20260706-102948-wan22_t2v_a14b_baseline)."
