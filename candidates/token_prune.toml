id = "token_prune"
kind = "patch"
description = "Wire feature-norm token pruning into the Cosmos3 DiT denoise block loop through efficiency/."
submodule = "Sol-LTX-Infer"
base_commit = "3a69b7788a055bed728ec367961c5f25b4ab48dc"
run_script = "scripts/run_cosmos3_sglang.sh"
eval_profile = "evals/profiles/official_video_t2v.toml"

[official_config]
model = "nvidia/Cosmos3-Super"
width = 1280
height = 720
frames = 189
fps = 24
steps = 35
guidance_scale = 6.0
flow_shift = 10.0
max_sequence_length = 4096
seed = 42
num_gpus = 4

[patch]
summary = "Compose TokenPrune around the Cosmos3 DiT block loop with OFF==baseline."
touch_points = [
  "python/sglang/multimodal_gen/runtime/efficiency/models/cosmos3_spec.py",
  "python/sglang/multimodal_gen/runtime/models/dits/cosmos3video.py",
]
off_identity_required = true

[agent]
goal_id = "token_prune"
owner = "codex"
root_branch = "codex/token_prune"
submodule_branch = "codex/token_prune-sol"
interactive_required = true
write_scope = [
  "Sol-LTX-Infer/python/sglang/multimodal_gen/runtime/efficiency/models/cosmos3_spec.py",
  "Sol-LTX-Infer/python/sglang/multimodal_gen/runtime/models/dits/cosmos3video.py",
]

[env]
MODEL_REPO = "nvidia/Cosmos3-Super"
NUM_GPUS = "4"
SEED = "42"
PROMPT = "A serene mountain lake at sunrise, mist rising off the still water, pine trees reflected on the surface, a small wooden boat drifting slowly, cinematic, high detail"
NEGATIVE_PROMPT = ""
SGLANG_COSMOS3_PRUNE_RATIO = "0.5"
SGLANG_COSMOS3_PRUNE_METHOD = "feat_norm"
SGLANG_COSMOS3_PRUNE_COMPENSATION = "prev"
SGLANG_COSMOS3_PRUNE_STEPS = "1,2"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
quality = "quality.json"
risk_notes = "risk_notes.md"
collection = "collection.json"
patch_summary = "patch_summary.md"

[slurm]
account = "nvr_elm_llm"
partition = "batch"
nodes = 1
gpus_per_node = 4
cpus_per_task = 64
mem = "0"
time = "04:00:00"
job_name = "autovideo-token-prune"
exclusive = true
