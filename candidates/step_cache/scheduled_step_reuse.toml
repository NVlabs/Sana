kind = "methodology"
purpose = "evidence"
description = "Scheduled denoise-step reuse baseline using the generic StepCache primitive."
model_profile = "cosmos3"

[id]
name = "scheduled_step_reuse"
dimension = "step_cache"
family = "whole_step_cache"

[references.external]
paper = "PAB: https://arxiv.org/html/2408.12588v3"
code = "VideoSys / PAB: https://github.com/NUS-HPC-AI-Lab/VideoSys"
notes = "PAB/VideoSys motivate cache/reuse exploration, but this row is a local whole-step StepCache baseline, not a public PAB implementation."

[references.local]
generic_impl = "techniques/methods/step_cache.py"
model_adapter_example = "snippets/sol-ltx-infer-reference.md"
runtime_example = "snippets/sol-ltx-infer-reference.md"

[requirements]
capabilities = ["has_denoise_steps", "supports_step_cache"]

[adapter]
model_spec = "Cosmos3"

[efficiency]
kind = "runtime_technique"
name = "step_cache"

[efficiency.params]
skip = "16-28"
delta_scale = 0.0

[env]
SGLANG_HQ_CANDIDATE_ID = "scheduled_step_reuse"
SGLANG_HQ_STEP_CACHE_SKIP = "16-28"
SGLANG_HQ_STEP_CACHE_DELTA = "0.0"

[verification]
mode = "gpu"
allow_non_bit_exact = true
quality_gate = "baseline-comparable"
