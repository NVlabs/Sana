# Standalone LTX-2.5 Stage-2 refiner on exactly 4xGB200.
# All model and sampling fields below are part of the fixed delivery contract.
# Only INPUT_ROOT, MANIFEST, OUTPUT_DIR, and METADATA_DIR are run-specific.

name    = "ltx25_refiner_gb200_sol"
runtime = "."
entry   = "run_refiner_gb200.sh"
gpus    = 4

LTX25_REFINER_WORLD_SIZE = "4"
LTX25_REFINER_PARALLELISM = "head_context"
LTX25_REFINER_PARALLEL_DEGREE = "4"
LTX25_REFINER_PARAMETER_REPLICATION = "full"
LTX25_REFINER_SELF_ATTN_HEAD_SHARDS = "4"
LTX25_REFINER_SELF_ATTN_TOKEN_SCOPE = "full_sequence"

LTX25_REFINER_WIDTH = "1920"
LTX25_REFINER_HEIGHT = "1088"
LTX25_REFINER_FRAME_COUNT = "241"
LTX25_REFINER_FPS = "24"
LTX25_REFINER_BATCH_SIZE = "1"

# Four sigma endpoints produce exactly three Stage-2 denoising updates.
LTX25_REFINER_SIGMAS = "0.909375,0.725,0.421875,0.0"
LTX25_REFINER_TAUS = "1.0,1.25,1.5"
LTX25_REFINER_TRANSFORMER_LAYERS = "48"
LTX25_REFINER_DENSE_SELF_ATTN_LAYERS = "0"
LTX25_REFINER_SOL_SELF_ATTN_LAYERS = "1-47"
