family = "video_t2va"
submodule = "models/minimax_h3/gb200/baseline"
run_script = "models/minimax_h3/gb200/baseline/scripts/run_minimax_h3_gpu.sh"
eval_profile = "evals/profiles/official_video_t2va_minimax_h3.toml"

# MiniMax-H3 is a joint audio+video generator: one 33B dense single-stream transformer denoises a
# single packed sequence carrying text conditioning, video latent rows and audio latent rows, with
# full self-attention over all of it. There is no vocoder and no post-hoc audio pass. The released
# checkpoint is guidance-distilled, so there is no CFG: one forward pass per step, no
# guidance_scale, no negative prompt.
#
# The two released partitions (FL2VA, Ref2VA) differ only in transformer weights. Only FL2VA is
# converted here; it serves t2va and fl2va, and MiniMaxH3Blocks never touches transformer_ref/.
#
# The model natively supports sparse attention, but the initial open-source release ships inference
# with full attention only — the vendor states the sparse implementation lands later. That is the
# obvious opening for SOL Attention / PISA.

[official_config]
model = "MiniMaxAI/MiniMax-H3"
revision = "9d710aedb174fa4448fcdeeb9a542f11ab52209a"
partition = "fl2va"
task = "t2va"
width = 1344
height = 768
frames = 124
fps = 24
duration_s = 5.167
steps = 50
flow_shift = 12.0
audio_flow_shift = 3.0
audio_sample_rate = 32000
audio_channels = 2
seed = 0
num_gpus = 4
context_parallel_degree = 1
transformer_dtype = "bf16"
text_encoder_dtype = "bf16"
vae_dtype = "bf16"
guidance_distilled = true
# Workload is the published SGLang MiniMax-H3 benchmark cell, so these numbers are directly
# comparable to the vendor table (8xB300 BF16 FL2VA: 19.04 s, 83,578 MB peak/GPU with Ulysses-8).

[architecture]
transformer_params = "33B dense single-stream"
transformer_layers = 50
hidden_size = 5376
num_attention_heads = 56
attention_head_dim = 128
ffn_dim = 14336
patch_size = [1, 2, 2]
latents_dim = 24
audio_latents_dim = 32
rope = "3D MM-RoPE over (t, h, w)"
text_encoder = "Qwen3-VL-32B, hidden states read at decoder layer 50, lm_head unused"
video_vae = "f16t4d24 causal video autoencoder, ViT decoder"
audio_vae = "32 kHz stereo, per-channel shared encoder/decoder, 40 Hz latent"
note = "~13B of the 33B lives in AdaLN branches whose modulation outputs can be precomputed and cached, so inference-only deployment need not load them. Not exploited by the baseline."

[baseline]
variant = "diffusers_modular_resident_bf16_eager"
status = "measured_single_gpu_resident_bf16_eager"
run_id = "baseline_5813128"
slurm_job_id = "5813128"
host = "nvl72086-T04"
request_s = 159.628
request_s_median = 159.628
denoise_gpu_s = 149.696
dit_evals = 49
per_step_gpu_ms = 3055.02
video_decode_gpu_s = 7.857
audio_decode_gpu_s = 0.105
unaccounted_s = 1.97
peak_memory_mib = 144454
load_s = 310.502
hardware = "1x NVIDIA GB200 189471 MiB holding the DiT, the Qwen3-VL conditioner and both VAEs, on one exclusive 4-GPU NVLink node"
timing_scope = "request_wall_from_both_models_resident_to_pipeline_return_cuda_synchronized"
warmup_requests = 1
warmup_s = 167.89
note = "No context parallelism: MiniMaxH3Transformer3DModel declares no _cp_plan, so diffusers cannot shard the packed sequence, even though MiniMaxH3AttnProcessor already carries _parallel_config and forwards it to dispatch_attention_fn. Ulysses over the 4 cards is optimization line #1 and is measured against this row."
note_dit_evals = "49 evaluations for 50 steps is correct, not an off-by-one: num_inference_steps counts sigma grid points including the terminal 0, so it drives one model evaluation less."
note_encode = "encode_gpu_s is absent for this run: the timer wrapped text_encoder.forward, but the encoder block calls text_encoder.model(...) directly to skip the language-model head, so it never fired. Text encoding is inside unaccounted_s (<= 1.97 s together with packing, layout and host work). Fixed in gpu_infer.py after this run."
note_load = "load_s is Lustre-bound and swings wildly — 39.7 s on job 5812989 versus 310.5 s here, same code and same files. It is excluded from request_s by construction."

