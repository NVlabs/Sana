note = "A kernel that computed the wrong expression could not land systematically closer to a float32 reference than the code it replaces. That is a stronger correctness signal than any tolerance gate."
note_metric_history = "Two earlier metrics were wrong in opposite directions and both had to be discarded. A global ratio max|diff|/max|ref| against bf16 eager was too loose — a kernel that dropped the shift term entirely scores 1.3e-2 and passes a 2e-2 gate. A per-element relative error was too strict for a reason unrelated to the kernels: normed*(1+scale)+shift cancels, so many outputs sit near zero and bf16 round-off divided by a near-zero reference gives 0.2-0.4 in correct code. It flagged every modulate fusion, and the wrong response would have been to loosen the gate until the real bugs fit back under it."

[acceleration.line2b_kernel_fusions.bugs_found]
note = "Four real bugs, found by adversarial review rather than by the test suite, which passed throughout. All were silent — wrong output, no exception, no out-of-bounds fault."
modulation_table_stride = "The six modulation tables come from `view(-1, 6*hidden).chunk(6, dim=-1)`, so each is a non-contiguous view with row stride 6*hidden. The kernels indexed them as `row * n_cols + col`, i.e. assuming contiguity, so only table row 0 was read correctly and every other row returned a neighbouring chunk's parameter. Fixed by passing the real stride."
index_batch_broadcast = "`adaln_indices` has one entry per sequence row and eager broadcasts it over the batch. The kernels indexed the flattened (batch*seq) row directly, reading past the end of the index tensor for batch > 1. Fixed with `row % n_index`."
output_stride_reuse = "`fused_rmsnorm_modulate` used one row stride for both a possibly non-dense input and a freshly allocated contiguous output, giving out-of-bounds writes for a non-dense input. Fixed by forcing the input contiguous."
rotary_config_guards = "`rotary_dim > head_dim` would make the partner load read into the next row, and an odd `rotary_dim` would desync the pairing. Not reachable at MiniMax-H3's 96/128 configuration; now rejected explicitly."

[acceleration.line2b_kernel_fusions.test_blind_spots]
note = "The test passed while three of the four bugs were live. Each blind spot is a way a test can agree with itself instead of with the model."
fabricated_layout = "It built the modulation tables with `torch.randn(rows, hidden)` — contiguous — while the model produces non-contiguous chunk views. Now built the model's way, with an assertion that forces the test to keep reproducing the strided layout."
batch_one_only = "Every case used batch=1, so the index broadcast bug could not appear. A batch=3 case was added."
excluded_output = "One of the fused kernel's two outputs was reported into a throwaway dict and never counted toward the verdict — and it was the one carrying the table indexing and feeding the FFN."
wrong_rope_dtype = "cos/sin were built in bfloat16 while `MiniMaxH3RotaryPosEmbed` returns float32, so the test never exercised the largest difference between the two paths."

