# Model profile for the local HunyuanVideo diffusers baseline submodule.
#
# This profile intentionally starts from the vanilla diffusers pipeline in the
# local Hunyuan-Diffusers submodule. Future acceleration jobs should patch that
# submodule, while this orchestration repo keeps launch/eval metadata.

id = "hunyuan_diffusers"
spec = "HunyuanVideoDiffusers"
display_name = "hunyuanvideo-community/HunyuanVideo"
family = "video_t2v"
submodule = "Hunyuan-Diffusers"
base_commit = "7638072479d7740f039bc9717273d4bdf0d2c787"
run_script = "scripts/run_hunyuan_diffusers_gpu.sh"
eval_profile = "evals/profiles/official_video_t2v_hunyuan.toml"

[official_config]
model = "hunyuanvideo-community/HunyuanVideo"
width = 1280
height = 720
frames = 129
fps = 24
steps = 50
guidance_scale = 6.0
true_cfg_scale = 1.0
max_sequence_length = 256
seed = 42
num_gpus = 1

# Canonical baseline timing/memory consumed by search/plan_eval.py
# (base_total = [baseline].total_s). Speedup convention matches Cosmos3
# models/cosmos3.toml [baseline]: total_s is GENERATION time (the diffusers
# pipe() call = denoise + VAE decode), EXCLUDING one-time model load/placement.
# Including the ~79s fixed load would systematically under-credit every
# generation technique. Source: canonical baseline Slurm job 3467620,
# runs/20260620-163957-hunyuan_diffusers_baseline-gpu-default-video,
# verified default output 1280x720/129f/24fps/50steps/seed42.
[baseline]
run_id = "20260620-163957-hunyuan_diffusers_baseline-gpu-default-video"
total_s = 881.8548491100082        # = generate_s (generation time; load excluded)
generate_s = 881.8548491100082
denoise_s = 881.8548491100082
load_s = 61.598657508031465
placement_s = 17.443134312983602
export_s = 1.8847035429207608
wall_total_s = 1007.4684964510379  # end-to-end incl. load/placement (evidence only)
max_memory_allocated_gib = 51.00729751586914
max_memory_reserved_gib = 62.212890625

[env]
PYTHON_BIN = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/Sol-LTX-Infer/.conda/ltx23/bin/python"
HF_HOME = "/home/haozhel/.cache/huggingface"
HF_HUB_CACHE = "/home/haozhel/.cache/huggingface/hub"
HF_HUB_OFFLINE = "1"
HUNYUAN_CACHE = "/home/haozhel/.cache/hunyuanvideo"
MODEL_REPO = "hunyuanvideo-community/HunyuanVideo"
NUM_GPUS = "1"
SEED = "42"
PROMPT = "A serene mountain lake at sunrise, mist rising off the still water, pine trees reflected on the surface, a small wooden boat drifting slowly, cinematic, high detail"
NEGATIVE_PROMPT = ""
HUNYUAN_HEIGHT = "720"
HUNYUAN_WIDTH = "1280"
HUNYUAN_NUM_FRAMES = "129"
HUNYUAN_FPS = "24"
HUNYUAN_NUM_INFERENCE_STEPS = "50"
HUNYUAN_GUIDANCE_SCALE = "6.0"
HUNYUAN_TRUE_CFG_SCALE = "1.0"
HUNYUAN_MAX_SEQUENCE_LENGTH = "256"
HUNYUAN_DTYPE = "bf16"
HUNYUAN_DEVICE = "cuda"
HUNYUAN_PLACEMENT = "cuda"
HUNYUAN_VAE_TILING = "true"
HUNYUAN_VAE_SLICING = "false"

[slurm]
account = "nvr_elm_llm"
partition = "batch"
nodes = 1
gpus_per_node = 4
cpus_per_task = 64
mem = "0"
time = "04:00:00"
job_name = "autovideo-hunyuan-diffusers-baseline"
exclusive = true

[seam_status]
baseline = "diffusers_control"
blocks = "local_submodule_target"
prunable_tokens = "not_wired"
swappable_attention = "diffusers_pipeline_target"
residual_tuple = "not_wired"
ffn_precision = "not_wired"
teacache_signal = "future_submodule_patch"
