id = "minimax_h3_gb10_kernel"
kind = "optimized"
purpose = "lossless"
description = "Adds the four fused Triton kernels and the fused QKV projection. Every one is bit-identical to the eager path it replaces, verified against `dit_reference/` rather than asserted: 1.387x on the DiT forward with EXACT on all five steps."
model_profile = "minimax_h3"

[runtime]
root = "models/minimax_h3/gb10_fp8"

[env]
H3_PROMPT_FILE = "models/minimax_h3/prompts/t2va_example_1.json"
H3_HEIGHT = "480"
H3_WIDTH = "832"
H3_NUM_FRAMES = "124"
H3_STEPS = "50"
H3_SEED = "0"
H3_WARMUP = "1"
H3_MEASURE = "1"
H3_KERNEL_FUSIONS = "1"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
quality = "quality.json"

[notes]
summary = "The whole tier is lossless, so it needs no quality argument and no eval gate — the check is arithmetic. `checks/check_quant_kernel.py` is where the one correction that buys it is recorded."
