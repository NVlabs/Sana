id = "hunyuan_video_sol_v3_morton"
kind = "patch"
purpose = "optimization"
description = "HunyuanVideo-13B SOL Attention v3 + Morton3D video-token reorder (PISA hyvideo piecewise kernel, density 0.15). Tests whether compact 3D blocks (vs upstream raster strips) sharpen top-k routing + centroid approximation. Kernel unmodified; reorder is external. No compile, no cache; 1 warmup pass."
model_profile = "hunyuan_video"

[runtime]
root = "models/hunyuan_video/optimized"

[env]
HUNYUAN_SOL_V3 = "1"
HUNYUAN_SOLV3_DENSITY = "0.15"
HUNYUAN_SOLV3_MORTON = "1"
HUNYUAN_WARMUP_PASSES = "1"
TORCHINDUCTOR_CACHE_DIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/hunyuan_video/torch_inductor"
TRITON_CACHE_DIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/hunyuan_video/triton"
TORCH_HOME = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/hunyuan_video/torch"
XDG_CACHE_HOME = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/hunyuan_video/xdg"
TMPDIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/hunyuan_video/tmp"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
