id = "wan21_t2v_1_3b_cache_only"
kind = "patch"
purpose = "optimization"
description = "Wan2.1-T2V-1.3B optimized: lossless EasyCache 0.036 ONLY (no kernel) — quality isolation. Single-GPU. Kernel+Cache only; SOL Attention added in *_full."
model_profile = "wan21_t2v_1_3b"

[runtime]
root = "models/wan21_t2v_1_3b/optimized"

[env]
WAN22_KERNEL_STACK = ""
WAN22_KERNEL_LEDGER = "1"
WAN22_COMPILE_MODE = "max-autotune-no-cudagraphs"
WAN22_COMPILE_FULLGRAPH = "0"
WAN22_CACHE_FAMILY = "easycache"
WAN22_EASYCACHE_THRESHOLD = "0.036"
TORCHINDUCTOR_CACHE_DIR = "${OUT_DIR}/.cache/torch_inductor"
TRITON_CACHE_DIR = "${OUT_DIR}/.cache/triton"
TORCH_HOME = "${OUT_DIR}/.cache/torch"
XDG_CACHE_HOME = "${OUT_DIR}/.cache/xdg"
TMPDIR = "${OUT_DIR}/.cache/tmp"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
