schema_version = 1
id = "ltx23"
display_name = "LTX-2.3 22B 1088x1920 241f two-stage HQ (LTX2TwoStageHQPipeline)"
legacy_profile = "models/ltx23.toml"
contract_kind = "model_baseline_minimal_copy"

[baseline]
manifest = "config/ltx23/baseline.toml"
runtime_root = "models/ltx23/baseline"
eval_profile = "evals/profiles/official_video_t2v_ltx23.toml"
description = "LTX-2.3 official two-stage HQ baseline with every acceleration seam explicitly off. Runnable code (variant env.sh + shared launch body + run shim) is vendored under models/ltx23; the 22B runtime, weights and the .conda/ltx23 interpreter are referenced read-only by absolute path via SGLANG_RUNTIME_ROOT."

[baseline.copy]
paths_are_repo_relative = true
include = [
  "models/ltx23.toml",
  "models/ltx23/model.toml",
  "models/ltx23/README.md",
  "models/ltx23/run_ltx23_common.sh",
  "models/ltx23/prompts/**",
  "models/ltx23/baseline/**",
  "config/ltx23/baseline.toml",
  "config/schema.md",
  "evals/profiles/official_video_t2v_ltx23.toml",
  "evals/tiers.toml",
  "scripts/launch_config.py",
  "scripts/collect_run.py",
  "search/plan_eval.py",
  "techniques/config_manifest.py",
]
exclude = [
  ".git/**",
  "**/__pycache__/**",
  "**/*.pyc",
  "runs/**",
  "output/**",
  "workflow/**",
  "search_space/**",
]

[[baseline.reference_only]]
name = "sglang_runtime"
path = "/path/to/sglang-runtime"
repo = "sglang-runtime"
repo_type = "code"
commit = "b0b7eb4d0a7f1f46118a356485f4523cf52e96dd"
reason = "SGLang multimodal_gen runtime holding LTX2TwoStageHQPipeline, the ltx2 DiT/VAE/vocoder modules and the ltx2_* Triton kernels, plus the .conda/ltx23 interpreter. Reached via SGLANG_RUNTIME_ROOT; neutral, never copied. Pinned to elm/v1_formal, the branch that carries scripts/ltx/ and scripts/cosmos/ in the layout the site docs reference."

[[baseline.reference_only]]
name = "ltx23_weights"
# Literal path, not a ${VAR} template: create_model_experiment.py copies these
# entries verbatim into the experiment metadata and nothing in the repo expands
# environment variables in them.
path = "${OUT_DIR}/.cache"
repo = "Lightricks/LTX-2.3"
repo_type = "model"
reason = "LTX-2.3 22B materialized weights + the x2 spatial upscaler. Override with MODEL_PATH / SPATIAL_UPSAMPLER when the cache lives elsewhere. Neutral, never copied."

[[baseline.reference_only]]
name = "ltx23_distilled_lora"
path = "${OUT_DIR}/.cache"
repo = "Lightricks/LTX-2.3"
repo_type = "model"
reason = "Official distilled LoRA (ltx-2.3-22b-distilled-lora-384[-1.1].safetensors), merged for stage 2. Different HF snapshots ship one filename or the other; the launch body probes both. Override with DISTILLED_LORA. Neutral, never copied."

[experiment_defaults]
worktree_mode = "model_baseline_minimal_copy"
experiments_root = "output/experiments"
state_dir = "state"
runs_dir = "runs"
logs_dir = "logs"
caches = ["tmp", "triton", "torch_extensions", "python_deps"]
