id = "cosmos3-stepcache-10-28-tokenprune-kr08"
kind = "composed"
description = "Cosmos3-Super + step_cache(skip=10-28, delta=0.5) + token_prune(keep_ratio=0.8, steps=2-9, feat_norm/prev). Conservative composition: less-aggressive token_prune (keep 80%, only 8 early steps) layered on the LOW-tier-winning step_cache. Targets MEDIUM tier -- step_cache alone @ 1.823x, token_prune adds a small bump on the early compute steps where step_cache hasn't yet skipped."
submodule = "Sol-LTX-Infer"
base_commit = "b95451114"
run_script = "scripts/run_cosmos3_sglang.sh"
eval_profile = "evals/profiles/official_video_t2v.toml"

[official_config]
model = "nvidia/Cosmos3-Super"
width = 1280
height = 720
frames = 189
fps = 24
steps = 35
guidance_scale = 6.0
flow_shift = 10.0
max_sequence_length = 4096
seed = 42
num_gpus = 4

[env]
