# Bernini text-to-video PRISTINE baseline profile (parallel to models/sana_video.toml).
#
# The runnable Bernini t2v code is VENDORED and self-contained under
# runtime/bernini_baseline/bernini_src/ (a clean copy of the upstream pristine
# tree, no git history). Baseline hot latency is ~129s text_to_vae_decode
# (median over the 5-prompt validation set). Full Bernini = Qwen2.5-VL-7B
# planner + Wan2.2-T2V-A14B renderer.
#
# Two NEUTRAL external assets are referenced by absolute path (they cannot live
# in git and reveal no optimization): the model WEIGHTS (BERNINI_WEIGHTS, passed
# to --config) and the vendored third-party python libs (BERNINI_DEPS, added to
# PYTHONPATH). Nothing is symlinked into the explorable code tree.

id = "bernini"
spec = "BerniniDiffusers"
display_name = "Bernini T2V 480p81 pristine baseline (Bernini-Diffusers)"
family = "video_t2v"
submodule = "runtime/bernini_baseline"
base_commit = ""
run_script = "scripts/run_bernini_gpu.sh"
eval_profile = "evals/profiles/official_video_t2v_bernini.toml"

[official_config]
model = "bernini_diffusers"
guidance_mode = "vae_txt_vit_wapg"
width = 848
height = 480
max_image_size = 842
frames = 81
fps = 16
steps = 50
flow_shift = 5.0
seed = 42
omega_txt = 4.0
omega_tgt = 0.5
omega_img = 1.0
omega_vid = 1.0
omega_scale = 1.0
vit_denoising_step = 5
vit_txt_cfg = 1.2
vit_img_cfg = 1.0
num_gpus = 4
ulysses = 4
timing_scope = "text_to_vae_decode"   # measured from text/condition-encode start to VAE-decode end

[baseline]
run_id = "20260704-091304-bernini_baseline-pristine-val5"
slurm_job_id = "3944185"
total_s = 128.989              # median text_to_vae_decode over the 5-prompt validation set (hot)
denoise_s = 115.593            # DiT diffusion loop (dominant)
decode_s = 1.644               # VAE decode
text_encoder_s = 0.097         # T5
vit_mllm_s = 4.249             # semantic planner
prompt_count = 5
warmup_passes = 1
reduction = "median_over_validation_set"
timing_scope = "text_to_vae_decode_hot_after_warmup_pass"
warm_steady_state = true
excludes = "model load, warmup pass, and compile (pristine runs eager)"
measured_pass_range_s = "128.5-129.7"   # calls 6-10, all post-warmup; +/-0.5%
baseline_attention = "pytorch_sdpa"   # reproducibility: SDPA resolves to the cuDNN flash kernel on GB200 sm100 (torch 2.12.1+cu130), bf16, head_dim 128
validation_set = ["prompt_00_polar_bear_guitar", "prompt_01_fox_autumn_forest", "prompt_02_dog_beach_frisbee", "prompt_03_astronaut_satellite", "prompt_04_chef_pancake"]
status = "measured_5prompt_480x848_81f_50steps_sdpa_hot"
note = "Reference videos at runs/<run_id>/outputs/videos/*.mp4; per-prompt breakdown in outputs/benchmark.json."

[env]
PYTHON_BIN = "/usr/bin/python3.12"
# --- neutral external assets (NOT code; reveal no optimization) ---
BERNINI_WEIGHTS = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/Bernini/ByteDance/Bernini-Diffusers"
BERNINI_DEPS = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/Bernini/.gpu-site-pure:/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/Bernini/.gpu-site"
BERNINI_FFMPEG = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/Bernini/.gpu-site/imageio_ffmpeg/binaries/ffmpeg-linux-aarch64-v7.0.2"
# --- run knobs ---
BERNINI_VAL_PROMPTS = "models/bernini/prompts/t2v_val5.json"
BERNINI_WARMUP_PASSES = "1"
FSDP = "1"
NCCL_NET_PLUGIN = "none"
NCCL_DEBUG = "WARN"
BERNINI_NPROC_PER_NODE = "4"
BERNINI_ULYSSES = "4"
BERNINI_NUM_FRAMES = "81"
BERNINI_MAX_IMAGE_SIZE = "842"
BERNINI_HEIGHT = "480"
BERNINI_WIDTH = "848"
BERNINI_STEPS = "50"
BERNINI_FLOW_SHIFT = "5.0"
BERNINI_SEED = "42"
BERNINI_FPS = "16"
BERNINI_GUIDANCE_MODE = "vae_txt_vit_wapg"
BERNINI_OMEGA_TXT = "4"
BERNINI_OMEGA_TGT = "0.5"
BERNINI_OMEGA_IMG = "1"
BERNINI_OMEGA_VID = "1"
BERNINI_OMEGA_SCALE = "1"
BERNINI_VIT_DENOISING_STEP = "5"
BERNINI_VIT_TXT_CFG = "1.2"
BERNINI_VIT_IMG_CFG = "1.0"

[slurm]
account = "nvr_elm_llm"
partition = "batch_long"
nodes = 1
gpus_per_node = 4
cpus_per_task = 144
mem = "920G"
time = "04:00:00"
job_name = "autovideo-bernini-t2v-pristine-baseline"
exclusive = true

[reference_only]
weights_repo = "ByteDance/Bernini-Diffusers"
weights_path = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/Bernini/ByteDance/Bernini-Diffusers"
deps_note = ".gpu-site / .gpu-site-pure vendored third-party libs (torch 2.5.1+cu124, diffusers 0.35.2, ...) referenced via BERNINI_DEPS on PYTHONPATH; neutral, not copied."
vendored_source = "runtime/bernini_baseline/bernini_src (clean copy of the upstream pristine tree)"
renderer_base = "Wan2.2-T2V-A14B"
planner_base = "Qwen2.5-VL-7B-Instruct"
upstream_repo = "https://github.com/bytedance/Bernini.git"
notes = "Baseline runs the vendored upstream code as-is (~129s text_to_vae_decode)."
