# Search dimension: diffusion step caching  (MODEL-AGNOSTIC)
#
# Metadata for the step-cache exploration dimension. Native subagents start from
# search_space/ and inspect the target model inference code directly; this file
# is not a fixed hyperparameter grid.

id = "step_cache"
title = "Diffusion step caching (skip/reuse whole denoise-step output)"
kind = "runtime_technique"
                                        # (TeaCache additionally needs a runtime modulated-input
                                        #  signal; discover it from inference code/traces)

# Two cache flavors searched in this dimension. Each lists the generic technique
# (efficiency registry name) + its model-agnostic param grid.

[[technique]]
name = "step_cache"                     # schedule-based skip + reuse / delta-extrapolate
search_axes = [
  "step schedule",
  "reuse mode",
  "delta/extrapolation policy",
  "warmup and forced recompute policy",
]

[[technique]]
name = "teacache"                       # similarity-adaptive skip (timestep-embedding rel-L1)
search_axes = [
  "signal source",
  "per-step accumulation rule",
  "per-layer or block scope",
  "threshold policy discovered from traces",
  "max consecutive reuse policy",
]

[[method_baseline]]
id = "scheduled_step_reuse"
family = "whole_step_cache"
tier = "wired"
status = "compose_ready"
description = "Generic StepCache can skip scheduled denoising steps and reuse or delta-extrapolate the previous denoiser output."
entrypoint = "efficiency/techniques/step_cache.py"
required_work = "Discover safe skip windows and delta policy from target traces; prove OFF identity and real skipped compute."

[[method_baseline]]
id = "teacache_signal_reuse"
family = "teacache"
tier = "candidate_wired"
status = "needs_model_signal"
description = "Generic TeaCache decision logic exists, but the target runtime must expose a reliable timestep/modulated-input signal."
entrypoint = "efficiency/techniques/teacache.py"
required_work = "Patch or verify the target-model signal stash; calibrate threshold, max hits, and periodic recompute."

[[method_baseline]]
id = "attention_broadcast"
family = "pab_attention_broadcast"
tier = "runtime_patch"
status = "not_wired"
description = "Cache spatial, temporal, cross, joint, or model-specific attention outputs across stable denoising intervals."
entrypoint = "Sol-LTX-Infer attention path"
required_work = "Patch attention-output cache state; record path-specific stability, broadcast windows, and artifact risks."

[[method_baseline]]
id = "block_layer_feature_cache"
family = "block_layer_cache"
tier = "runtime_patch"
status = "not_wired"
description = "Reuse transformer block, residual, MLP/FFN, norm/modulation, or stage outputs for selected layers and steps."
entrypoint = "Sol-LTX-Infer block loop"
required_work = "Patch block-level cache payload and refresh policy; measure saved compute versus memory overhead."

[[method_baseline]]
id = "adaptive_delta_forecast"
family = "predictive_delta_cache"
tier = "runtime_patch"
status = "not_wired"
description = "Predict future features with deltas, forecast terms, or lightweight measured corrections instead of stale reuse."
entrypoint = "Sol-LTX-Infer denoiser/block path"
required_work = "Patch forecast payload and correction policy; record accumulated error, refresh triggers, and quality evidence."

# Eval binding (model-agnostic; the model profile supplies the baseline to beat).
[eval]
profile = "evals/profiles/official_video_t2v.toml"
min_speedup_for_experimental = 1.03
min_speedup_for_promotion = 1.10

[loop]
granularity = "per_step"                       # axis this dimension searches: per_step | per_module | per_strategy
objective = ["min_latency", "min_peak_mem"]  # improvement vs models/<id>.toml [baseline]; either counts
max_iters = 40                           # search budget per dimension (hyperparameter)
early_stop_patience = 0                  # fixed-budget frontier mode; 0 disables patience early stop
keep = "frontier_candidates"             # keep candidates that improve quality OR speed/memory
tiers = "evals/tiers.toml"               # speed targets: low=1.5x, medium=2.0x, high=3.0x
# Retain a candidate during the 40-iteration loop if quality improves OR latency/peak_mem improves.
# Discard it only when neither quality nor speed/memory improves.
# Structured-negative is logged as a proposal/failure signature; it does not stop this default loop.
# After the loop, the main agent selects 1.5x/2.0x/3.0x winners by Gemini+LPIPS quality ranking.
