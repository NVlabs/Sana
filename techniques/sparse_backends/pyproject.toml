[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-attn"
version = "0.5.0"
description = "Sol-Attn forward kernels for NVIDIA and Apple Silicon GPUs"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["sol_attn*"]

[tool.setuptools.package-data]
sol_attn = ["THIRD_PARTY_NOTICES.md", "sm100/LICENSE.flash-attention"]
