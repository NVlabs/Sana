# Search dimension: feature-norm token pruning  (MODEL-AGNOSTIC)
#
# Metadata for the token-prune exploration dimension. Native subagents start
# from search_space/ and inspect the target model inference code directly; this
# file is not a fixed hyperparameter grid.

id = "token_prune"
title = "Feature-norm token pruning (gather prunable tokens, scatter after blocks)"
kind = "runtime_technique"

[[technique]]
name = "token_prune"
search_axes = [
  "token span",
  "salience signal",
  "keep/drop policy",
  "compensation policy",
  "layer and step window",
]

[[method_baseline]]
id = "feature_norm_prune"
family = "token_pruning"
tier = "wired"
status = "compose_ready"
description = "Generic TokenPrune gathers a model-declared prunable span, scores tokens, runs blocks on kept tokens, then scatters back."
entrypoint = "efficiency/techniques/token_prune.py"
required_work = "Verify the target model exposes the intended prunable span; discover keep ratio, scoring signal, layer/step window, and compensation."

[[method_baseline]]
id = "shape_stable_compute_mask"
family = "token_masking"
tier = "runtime_patch"
status = "not_wired"
description = "Keep tensor shapes stable but mask selected tokens from attention, MLP, FFN, routing, or update paths."
entrypoint = "Sol-LTX-Infer block/attention/MLP path"
required_work = "Patch mask consumption in real kernels; prove masked compute is actually skipped or cheaper."

[[method_baseline]]
id = "tome_merge_restore"
family = "token_merging"
tier = "runtime_patch"
status = "not_wired"
description = "Merge similar visual tokens into representatives, run expensive blocks on reduced tokens, then unmerge or residual-correct."
entrypoint = "Sol-LTX-Infer token layout path"
required_work = "Patch merge/unmerge state; prove positional restoration, prompt alignment, and gather/scatter overhead."

[[method_baseline]]
id = "region_dynamic_density"
family = "region_or_dynamics_aware_selection"
tier = "runtime_patch"
status = "not_wired"
description = "Vary token density by region, timestep, layer, motion, prompt salience, or sample difficulty."
entrypoint = "Sol-LTX-Infer token scoring and block path"
required_work = "Patch adaptive density policy; record region labels or dynamics signals and dense fallback."

[[method_baseline]]
id = "cluster_representative_update"
family = "cluster_aware_pruning"
tier = "runtime_patch"
status = "not_wired"
description = "Cluster latent/video tokens and update representatives or high-change members, then broadcast/interpolate to the cluster."
entrypoint = "Sol-LTX-Infer token selection path"
required_work = "Patch clustering and restoration; measure clustering overhead, spatial seams, and temporal popping."

# Eval binding (model-agnostic; the model profile supplies the baseline to beat).
[eval]
profile = "evals/profiles/official_video_t2v.toml"
min_speedup_for_experimental = 1.03
min_speedup_for_promotion = 1.10

[loop]
granularity = "per_step"                       # axis this dimension searches: per_step | per_module | per_strategy
objective = ["min_latency", "min_peak_mem"]  # improvement vs models/<id>.toml [baseline]; either counts
max_iters = 40                           # search budget per dimension (hyperparameter)
early_stop_patience = 0                  # fixed-budget frontier mode; 0 disables patience early stop
keep = "frontier_candidates"             # keep candidates that improve quality OR speed/memory
tiers = "evals/tiers.toml"               # speed targets: low=1.5x, medium=2.0x, high=3.0x
# Retain a candidate during the 40-iteration loop if quality improves OR latency/peak_mem improves.
# Discard it only when neither quality nor speed/memory improves.
# Structured-negative is logged as a proposal/failure signature; it does not stop this default loop.
# After the loop, the main agent selects 1.5x/2.0x/3.0x winners by Gemini+LPIPS quality ranking.
