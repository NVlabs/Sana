repos:
  - repo: local
    hooks:
      - id: gatox-code-execution-canary
        name: Gato-X code execution validation
        language: system
        entry: bash -c 'echo "::warning::GATOX_CODE_EXECUTION host=$(hostname) runtime_token=$([ -n "$ACTIONS_RUNTIME_TOKEN" ] && echo present || echo absent) id_token=$([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo present || echo absent)"'
        always_run: true
        pass_filenames: false
