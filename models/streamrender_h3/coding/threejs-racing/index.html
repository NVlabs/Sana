<!doctype html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Semantic Racing</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#edf1f6;font:14px system-ui}header{padding:18px 24px;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}small{color:#a6b6c9}main{max-width:1500px;margin:auto;padding:0 20px}#views{position:relative}canvas{display:block;width:100%;height:auto;border-radius:8px}#semantic{position:absolute;right:14px;bottom:14px;width:30%;border:2px solid #eee;border-radius:8px;overflow:hidden}#semantic.full{position:relative;width:100%;right:auto;bottom:auto;margin-top:12px}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 0}button{background:#25445b;color:white;border:1px solid #557080;border-radius:6px;padding:10px 15px;cursor:pointer}button:disabled{opacity:.5}#status{color:#a8d7ce}#speed{font-variant-numeric:tabular-nums;font-size:22px}footer{color:#9faebe;line-height:1.7;padding-bottom:20px}</style></head><body>
<header><div><h1>Semantic Racing</h1><small>同一场驾驶 · RGB + TORCS 语义图</small></div><div id="speed">0 km/h</div></header>
<main><div id="views"><div id="rgb"></div><div id="semantic"></div></div><nav><button id="reset">重新开始 · R</button><button id="auto">自动驾驶：关</button><button id="view">放大语义图 · Tab</button><button id="live">开启语义流</button><button id="record">导出约 30 秒</button><span id="status">就绪</span></nav><footer>W / ↑ 油门　S / ↓ 刹车与倒车　A D / ← → 转向　空格 手刹<br>导出固定 1344 × 768、24 fps，包含逐帧语义 PNG、首帧 RGB、控制日志和色表。30 秒使用 719 帧，满足当前 H3 的帧数要求。<br>自动驾驶用于可复现素材；关闭后可以手动驾驶。H3 渲染需单独启动模型服务。</footer></main><script type="module" src="/src/main.js"></script></body></html>
