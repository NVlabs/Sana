# Search dimension: KWL operator fusion  (MODEL-AGNOSTIC)
#
# Metadata for the kernel/operator-fusion exploration dimension. Native
# subagents start from search_space/ and inspect the target model inference code
# directly; this file is not a fixed hyperparameter grid.

id = "kwl_fusion"
title = "Exact kernel and operator fusion"
kind = "build_transform"

[[technique]]
name = "kwl_fusions"
search_axes = [
  "hot operator pattern",
  "method family",
  "fusion boundary",
  "kernel/backend choice",
  "compile mode",
  "graph capture mode",
  "layout/copy elimination",
  "launch-overhead reduction",
  "stream overlap",
  "fallback policy",
  "numeric tolerance",
  "warm/cold cache state",
]

[eval]
profile = "evals/profiles/official_video_t2v.toml"
min_speedup_for_experimental = 1.03
min_speedup_for_promotion = 1.10

[loop]
granularity = "per_strategy"                       # axis this dimension searches: per_step | per_module | per_strategy
objective = ["min_latency", "min_peak_mem"]  # improvement vs models/<id>.toml [baseline]; either counts
max_iters = 40                           # search budget per dimension (hyperparameter)
early_stop_patience = 0                  # fixed-budget frontier mode; 0 disables patience early stop
keep = "frontier_candidates"             # keep exact candidates that improve quality OR speed/memory
tiers = "evals/tiers.toml"               # speed targets: low=1.5x, medium=2.0x, high=3.0x
# KWL is lossless/exact: speed or memory candidates are retained only when OFF
# identity passes and ON quality/numeric evidence does not regress. Numeric or
# quality candidates are retained only when speed does not meaningfully regress.
# Discard candidates with no quality/numeric improvement and no speed/memory
# improvement; reject semantic changes, broken OFF identity, or silent fallback.
# Structured-negative is logged as a proposal/failure signature; it does not stop this default loop.
# After the loop, the main agent selects 1.5x/2.0x/3.0x winners by Gemini+LPIPS quality ranking.
