<svg viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ontology boundary diagram</title>
  <desc id="desc">A word points to a broad domain; ontology defines a boundary and three properties inside it.</desc>
  <rect width="560" height="460" fill="#fbfaf5"/>

  <text x="280" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8a877f" letter-spacing="0.32em">THE WORD</text>
  <text x="280" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-style="italic" fill="#111">"success"</text>

  <circle cx="280" cy="290" r="170" fill="none" stroke="#8a877f" stroke-width="1.1" stroke-dasharray="4 5"/>

  <g font-family="Georgia, serif" font-size="14" font-style="italic" fill="#5a5a56">
    <text x="155" y="195" text-anchor="middle">learning speed</text>
    <text x="405" y="195" text-anchor="middle">team morale</text>
    <text x="410" y="395" text-anchor="middle">shipping speed</text>
    <text x="150" y="395" text-anchor="middle">customer delight</text>
  </g>

  <rect x="180" y="218" width="200" height="148" fill="#fbfaf5" stroke="#111" stroke-width="1.4"/>
  <rect x="225" y="208" width="110" height="22" fill="#f4f1e9" stroke="#111" stroke-width="1"/>
  <text x="280" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#111" letter-spacing="0.28em" font-weight="700">BOUNDARY</text>

  <text x="280" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#3a3a3a">"revenue this quarter only"</text>
  <line x1="220" y1="268" x2="340" y2="268" stroke="#c8c3b2" stroke-width="0.8"/>

  <g font-family="Georgia, serif" font-size="15" fill="#111">
    <text x="280" y="293" text-anchor="middle">revenue amount</text>
    <text x="280" y="318" text-anchor="middle">deal count</text>
    <text x="280" y="343" text-anchor="middle">new customers</text>
  </g>

  <line x1="280" y1="380" x2="280" y2="418" stroke="#111" stroke-width="0.8"/>
  <text x="280" y="438" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#111" letter-spacing="0.28em" font-weight="700">PROPERTIES × 3</text>
</svg>
