[acceleration.line3_cache.integration_defects]
hook_order = "HookRegistry.register_hook wraps the current forward, so the last hook registered is outermost. A cache enabled after context parallelism sits outside the split and reads full-length hidden_states while the inner forward returns the rank's shard. Cache must be registered first, CP outermost."
cache_context = "Caches with cross-step state resolve it through HookRegistry._set_context, which upstream pipelines establish by wrapping each denoiser call in `transformer.cache_context(...)`. MiniMax-H3's modular denoise loop has no such wrapper because it was never wired for caching upstream."
child_registry_cache = "HookRegistry._get_child_registries memoizes its child list on first call with no invalidation. In a sweep the first cache_context call snapshots the hook tree, and any cache enabled afterwards registers hooks on modules outside that snapshot, which _set_context then never reaches."
block_registration = "MiniMaxH3TransformerBlock has no TransformerBlockRegistry entry upstream; the cache hooks need one. Registered at runtime so the vendored source stays pristine."
cp_decision = "FirstBlockCache's skip metric is computed on whatever residual the hook sees, which under CP is the rank's shard. Ranks can disagree and split the Ulysses all-to-all across a subset of participants. Reduced to the global ratio with one all-reduce of two scalars per step."

[acceleration.line3b_step_cache]
name = "teacache_easycache"
status = "measured_pending_visual_gate"
kind = "approximation"
slurm_job_ids = ["5816766", "5817239"]
basis = "context_parallel_ulysses4 + native attention"
implementation = "models/minimax_h3/optimized/step_cache.py"
note_vs_fbcache = "Both are implemented to their own semantics rather than on FirstBlockCache's controller. FBCache must run the first block every step to obtain its signal and only reuses the residual of the remaining blocks, so a skipped step still pays 1/50 of the stack. TeaCache and EasyCache derive their signal from quantities available before the first block, so a skipped step runs no block at all."
note_teacache_calibration = "TeaCache's rescaling polynomial is a per-model calibration and none is published for MiniMax-H3, so the identity is used and the controller reduces to accumulated raw rel-L1 thresholding. These thresholds are therefore NOT comparable to published TeaCache thresholds for other models, and the comparison below is 'uncalibrated TeaCache vs calibration-free EasyCache' rather than a verdict on the methods."
note_noise = "request_s carries a ~10 s non-denoise floor (VAE decode plus host) that varies about 10% run to run — the same size as the gap between adjacent thresholds. denoise_gpu_s is the low-noise comparator. easycache_1.20 is the clearest case: its denoise is lower than easycache_0.80 while its request_s is nearly identical, because its non-denoise landed at 12.27 s against a 9.90 s reference."
note_ceiling = "The non-denoise floor caps this whole line at roughly 5.3x over the lossless CP reference (54.0 / 9.9(). teacache_0.25 already skips 38 of 49 steps with denoise down to 10.6 s, so threshold tuning is close to exhausted. The remaining lever is the VAE decode, not the DiT."
note_off_identity = "easycache thresholds 0.05 and 0.10 never fired (0 of 49 skipped) and reproduced the lossless output with audio MSE exactly 0.0 and infinite PSNR. That is a free off-identity check: the cache plumbing — the forward wrappers, the CP hook re-ordering, the reduced distances — is numerically transparent when the controller does not engage. The 1.2% slowdown on those runs is the pure cost of computing the signal and reducing it."

[acceleration.line3b_step_cache.finding]
headline = "EasyCache is the only method measured here with a high-fidelity operating point."
detail = "easycache at 0.20 gives 1.234x over the lossless CP reference at 37.09 dB PSNR and 6.4e-5 audio MSE — the same video with small numerical differences. Every FirstBlockCache and TeaCache configuration tried, including their most conservative, sits at 14-19 dB, which is trajectory divergence into a different sample rather than degradation of the same one. The quality cliff is between EasyCache 0.20 and 0.30 (12 vs 20 skipped steps)."
matched_skip_comparison = "At matched skip counts EasyCache is better on both modalities: 26 skips gives 17.10 dB / 1.90e-4 against TeaCache's 27 skips at 15.38 dB / 2.40e-4, and 31 skips gives 16.14 dB / 3.99e-4 against TeaCache's 34 skips at 14.51 dB / 5.54e-4."
why = "EasyCache thresholds an estimate of the *output* change, using a transformation rate it re-measures at every recompute. Uncalibrated TeaCache thresholds accumulated *input* change, and mapping input change to output change is exactly what the missing per-model polynomial is for."
saturation = "EasyCache saturates near 1.98x: raising the threshold from 0.80 to 1.20 adds only two skipped steps, because the measured rate rises with the skip gap (1.50 to 1.72) and self-limits the accumulator. TeaCache keeps skipping up to 38 of 49 and reaches further on speed."

