name = "codex_executor"
kind = "orchestration"
callable_by = ["workflow/attention_pa/workflow.py"]
description = "Run one managed Codex autorun TUI executor turn for Sana PISA attention optimization."

inputs = ["goal_dir", "goal.md", "STOP_HOOK_RESUME.md", "autorun_model"]
outputs = ["agent_last.md", "AGENT-STATUS.json", "PISA-SEARCH-STATE.json", "PISA-RECIPES.json", "codex_exit_code", "NODE-COMPLETE.json"]
outcomes = ["exited", "failed"]
side_effects = ["may_modify_worktree", "may_write_goal_dir"]
