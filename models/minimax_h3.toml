note = "Every configuration produces a different sample, not a near-identical one — the same headline deviation as torch.compile. This is NOT the cache line's kind of approximation: no work is skipped and no precision is lowered, and the fused kernels are measurably closer to a float32 reference than the eager code they replace. A 49-step diffusion trajectory is chaotic, so any change in rounding diverges it, including a change that improves accuracy. 'Mathematically exact' does not imply 'same output' here, and usability can only be settled by the visual and VLM gates, exactly as for the cache line."
note_open_question = "The same question has never been asked of CP=4 itself: the all-to-all changes reduction order, so the topology line may diverge from the single-GPU baseline in the same way. It is labelled lossless in line1_topology on the strength of its math, not on a measured comparison of outputs."

