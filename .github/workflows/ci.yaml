name: ci
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run tests-bash'
        required: false
        type: boolean
        default: false
      test_target:
        description: 'Test job to run (requires run_tests)'
        required: false
        type: choice
        default: all
        options:
          - all
          - test-inference
          - test-training-vae
          - test-training-fsdp
          - test-training-video
          - test-training-sana-wm-stage1
          - test-training-sana-wm-distill
          - test-training-longsana
          - test-training-sol-rl
  # Every PR: pre-commit runs unprivileged (read-only token, no secrets), so fork code is safe here.
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Adding the `run-tests` label (write/triage access only) approves ONE test run of the PR head at
  # labeling time. Later pushes never run with secrets; re-review and re-label to test new commits.
  pull_request_target:
    types: [labeled]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main, feat/Sana-public, feat/Sana-public-for-NVLab]
    paths-ignore:
      - '**.md'
      - 'docs/**'
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# if: ${{ github.repository == 'Efficient-Large-Model/Sana' }}
jobs:
  pre-commit:
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'run-tests'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # Only reached under pull_request_target after a maintainer added `run-tests`.
          allow-unsafe-pr-checkout: true
      # - name: Set up Python
      #   uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      #   with:
      #     python-version: 3.10.10
      - name: Test pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  test-inference:
    needs: pre-commit
    # Secrets live in the `gpu-ci` environment, which only the main branch can deploy to.
    environment: gpu-ci
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_tests == 'true' &&
       (github.event.inputs.test_target == '' || github.event.inputs.test_target == 'all' || github.event.inputs.test_target == 'test-inference')) ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'run-tests')
    runs-on:
      - self-hosted
      - sana-runner
    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # Only reached under pull_request_target after a maintainer added `run-tests`.
          allow-unsafe-pr-checkout: true
      # - name: Set up Python
      #   uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      #   with:
      #     python-version: 3.10.10
      - name: Clean Python caches
        run: |
          echo "Removing stale Python byte code files..."
          find . -type d -name "__pycache__" -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete
      - name: Set up the environment
        env:
          SANA_SLURM_ACCOUNT: ${{ secrets.SANA_SLURM_ACCOUNT }}
          SANA_SLURM_PARTITION: ${{ secrets.SANA_SLURM_PARTITION }}
          SKIP_ENV_SETUP: true
        run: |
          bash environment_setup.sh
      - name: Update 'sana-run' command in the Runner's default env
        env:
          CONDA_SH_PATH: ${{ secrets.CONDA_SH_PATH }}
          CONDA_ENV_NAME: ${{ secrets.CONDA_ENV_NAME }}
        run: |
          echo "--- Updating 'sana-run' command on the CI runner ---"
          source "$CONDA_SH_PATH"
          conda activate "$CONDA_ENV_NAME"
          pip install -e .
          echo "$CONDA_PREFIX/bin" >> "$GITHUB_PATH"
          echo "--- 'sana-run' command updated. ---"
      - name: Run inference tests
        env:
          CONDA_ENV_NAME: ${{ secrets.CONDA_ENV_NAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          sana-run --pty -m ci -J test-inference bash tests/bash/inference/test_inference.sh
