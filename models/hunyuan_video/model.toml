schema_version = 1
id = "hunyuan_video"
display_name = "HunyuanVideo-13B 720p129 T2V baseline (diffusers HunyuanVideoPipeline, dense)"
legacy_profile = "models/hunyuan_video.toml"
contract_kind = "model_baseline_minimal_copy"

[baseline]
manifest = "candidates/hunyuan_video_baseline.toml"
runtime_root = "models/hunyuan_video/baseline"
eval_profile = "evals/profiles/official_video_t2v_hunyuanvideo_13b.toml"
description = "HunyuanVideo-13B t2v baseline (pristine diffusers HunyuanVideoPipeline: dense attention, no cache, no compile). Runnable code is vendored in models/hunyuan_video/baseline; weights are referenced read-only through MODEL_REPO. The optimized candidate adds TeaCache, torch.compile, and the released Sol-Attn SM90/SM100 kernel with exact text KV sink and dense text queries."

[baseline.copy]
paths_are_repo_relative = true
include = [
  "models/hunyuan_video.toml",
  "models/hunyuan_video/**",
  "candidates/hunyuan_video_baseline.toml",
  "candidates/schema.md",
  "evals/profiles/official_video_t2v_hunyuanvideo_13b.toml",
  "evals/tiers.toml",
  "scripts/launch_candidate.py",
  "scripts/collect_run.py",
  "search/plan_eval.py",
  "techniques/candidate_manifest.py",
]
exclude = [
  ".git/**",
  "**/__pycache__/**",
  "**/*.pyc",
  "runs/**",
  "output/**",
  "workflow/**",
  "search_space/**",
]

[[baseline.reference_only]]
name = "hunyuanvideo_13b_diffusers_weights"
path = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/pretrained_models/HunyuanVideo"
repo = "hunyuanvideo-community/HunyuanVideo"
repo_type = "model"
reason = "HunyuanVideo-13B diffusers weights (transformer bf16 + llama/clip text encoders + causal-3D VAE); referenced by absolute path via MODEL_REPO. Neutral, never copied."

[[baseline.reference_only]]
name = "hunyuan_diffusers_env"
path = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/sparse_attn_training/.venv"
repo_type = "python_env"
reason = "venv with torch 2.11+cu128 + diffusers (HunyuanVideoPipeline) + CuTe DSL/Triton for the SOL kernels; used via PYTHON_BIN. Neutral, never copied."

[experiment_defaults]
worktree_mode = "model_baseline_minimal_copy"
experiments_root = "output/experiments"
state_dir = "state"
runs_dir = "runs"
logs_dir = "logs"
caches = ["tmp", "triton", "torch_extensions", "python_deps"]
