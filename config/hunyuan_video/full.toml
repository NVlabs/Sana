id = "hunyuan_video_full"
kind = "patch"
purpose = "optimization"
description = "HunyuanVideo-13B full optimization: TeaCache, torch.compile, and released Sol-Attn at tau 1.0 with exact text KV sink and dense text queries."
model_profile = "hunyuan_video"

[runtime]
root = "models/hunyuan_video/optimized"

[env]
SGLANG_HQ_TEACACHE_THRESHOLD = "0.15"
SGLANG_HQ_TEACACHE_START_STEP = "6"
SGLANG_HQ_TEACACHE_MAX_HITS = "2"
HUNYUAN_COMPILE = "1"
HUNYUAN_COMPILE_MODE = "default"
HUNYUAN_SOL_ATTN = "1"
HUNYUAN_SOL_TAU = "1.0"
HUNYUAN_SOL_THRESH_TYPE = "diag"
HUNYUAN_SOL_KV_SPLITS = "auto"
HUNYUAN_SOL_MORTON = "0"
HUNYUAN_WARMUP_PASSES = "1"
TORCHINDUCTOR_CACHE_DIR = "${OUT_DIR}/.cache/torch_inductor"
TRITON_CACHE_DIR = "${OUT_DIR}/.cache/triton"
TORCH_HOME = "${OUT_DIR}/.cache/torch"
XDG_CACHE_HOME = "${OUT_DIR}/.cache/xdg"
TMPDIR = "${OUT_DIR}/.cache/tmp"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
