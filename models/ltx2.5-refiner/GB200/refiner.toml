LTX25_REFINER_SOL_THRESH_TYPE = "diag"
LTX25_REFINER_SOL_KV_SPLITS = "auto"
SOL_ATTN_STRICT = "1"

LTX25_REFINER_DTYPE = "bfloat16"
LTX25_REFINER_LORA_STRENGTH = "0.8"
LTX25_REFINER_CACHE = "0"
LTX25_REFINER_COMPILE = "0"
LTX25_REFINER_OFFLOAD = "0"
LTX25_REFINER_QUANTIZATION = "none"
LTX25_REFINER_SINK = "0"
LTX25_REFINER_REORDER = "0"

# One excluded resident warm-up followed by one measured hot request.
LTX25_REFINER_WARMUP_REQUESTS = "1"
LTX25_REFINER_MEASURE_REQUESTS = "1"
LTX25_REFINER_WARMUP_INDEX = "0"
LTX25_REFINER_SAMPLE_INDEX = "0"

LTX25_REFINER_WEIGHTS_ROOT = "/lustre/fsw/portfolios/nvr/users/yitongl/pretrained_models/LTX-2.5-public"
LTX25_REFINER_TAEHV_WEIGHT = "/lustre/fsw/portfolios/nvr/users/yitongl/pretrained_models/LTX-2.5-public/taehv/taeltx2_3_wide.pth"
LTX25_REFINER_TAEHV_SOURCE_COMMIT = "32ac0146b11007cda5a57b60a3b35653361fb8a4"
LTX25_REFINER_TAEHV_WEIGHT_SHA256 = "007788e6b9cb7f77e8589ae30ba7456b119d38b0d017e1d349c1c1d11e3d6339"

