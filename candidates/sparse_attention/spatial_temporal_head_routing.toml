kind = "env_only"
purpose = "blocker_probe"
description = "Pure sparse attention policy that routes spatial and temporal heads through separate sparse masks."
model_profile = "cosmos3"

[id]
name = "spatial_temporal_head_routing"
dimension = "sparse_attention"
family = "head_routing"

[references.external]
paper = "AdaSpa paper: https://openaccess.thecvf.com/content/ICCV2025/html/Xia_Training-free_and_Adaptive_Sparse_Attention_for_Efficient_Long_Video_Generation_ICCV_2025_paper.html"
code = "Sparse VideoGen: https://github.com/svg-project/Sparse-VideoGen"
notes = "Training-free adaptive sparse attention and Sparse VideoGen provide the closest canonical patterns."

[references.local]
generic_impl = "techniques/transforms/sparse_attention.py"
model_adapter_example = "snippets/sol-ltx-infer-reference.md"
runtime_example = "snippets/sol-ltx-infer-reference.md"

[requirements]
capabilities = ["has_attention_layers", "has_spatiotemporal_token_layout", "has_attention_backend_switch"]

[adapter]
model_spec = "Cosmos3"

[efficiency]
kind = "build_transform"
name = "sparse_attention"

[efficiency.params]
sparsity = 0.88
block_size = 64
frame_size = 2
component = "transformer"
route_mode = "spatial_temporal_head_routing"
dense_fallback = "fa"
stage2_dense_layers = "0-1"

[env]
SGLANG_HQ_CANDIDATE_ID = "spatial_temporal_head_routing"
SGLANG_HQ_SPARSE_ATTENTION_PATTERN = "spatial_temporal_head_routing"

[verification]
mode = "gpu"
allow_non_bit_exact = true
quality_gate = "baseline-comparable"
