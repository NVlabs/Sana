# LTX-2.5 public two-stage pipeline on 4xGB200 -- delivered optimized stack.
# Run only inside a four-GPU allocation:
#   python3 scripts/run.py models/ltx25/GB200/fullopt.toml

name    = "ltx25_gb200_fullopt"
runtime = "."
entry   = "run_ltx25_gpu.sh"
gpus    = 4

LTX25_VARIANT  = "fullopt"
LTX25_PROFILE  = "default5s"
LTX25_WORLD_SIZE = "4"

# Stage 1: guidance-batch parallelism + globally synchronized FBCache +
# cache-aware per-block torch.compile. Stage 2 remains 2x2 TDP. SOL sparse
# attention is deliberately excluded from this validated delivery.
LTX25_S1_PARALLEL = "cfg"
LTX25_CFG_ORDER   = "0,3,1,2"
LTX25_CACHE       = "fbcache"
LTX25_CACHE_THRESHOLD = "0.08"
LTX25_CACHE_WARMUP = "1"
LTX25_CACHE_MAX_CONSECUTIVE = "10"
LTX25_COMPILE = "1"
LTX_SOL_STAGE1 = "0"

LTX25_WEIGHTS_ROOT = "/lustre/fsw/portfolios/nvr/users/yitongl/pretrained_models/LTX-2.5-public"
LTX25_COMPILE_CACHE_ROOT = ".cache/ltx25/gb200-sm100_py31311_torch2110-cu130_triton360/ltx25-7954dcb-ccedf84-stage-scope-v1"

LTX25_PROMPT_FILES = "models/ltx25/prompts/p01_multishot.txt:models/ltx25/prompts/p02_newsbroadcast.txt:models/ltx25/prompts/p03_frogyoga.txt"
LTX25_WARMUP_REQUESTS = "3"
LTX25_MEASURE_REQUESTS = "3"
LTX25_KEEP_WARMUP = "0"
LTX25_STAGE1_STEPS = "30"
LTX25_FPS = "24"
LTX25_SEED = "42"
