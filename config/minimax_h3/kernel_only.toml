id = "minimax_h3_kernel_only"
kind = "patch"
purpose = "optimization"
description = "MiniMax-H3 1344x768/124f, 8xGB200 Ulysses8: lossless kernel line only — packed QKV exchange, Triton relayout, AdaLN precompute, sharded+batched VAE decode."
model_profile = "minimax_h3"
submodule = "models/minimax_h3/GB200"
run_script = "run_minimax_h3_gpu.sh"

[runtime]
root = "models/minimax_h3/GB200"
entry = "gpu_infer.py"

[env]
H3_ULYSSES_DEGREE = "8"
H3_KERNEL = "1"
H3_SOL_ATTN = "0"
H3_SHARD_VAE = "1"
H3_VAE_BATCHED = "1"
TORCHINDUCTOR_CACHE_DIR = "${OUT_DIR}/.cache/torch_inductor"
TRITON_CACHE_DIR = "${OUT_DIR}/.cache/triton"
TORCH_HOME = "${OUT_DIR}/.cache/torch"
XDG_CACHE_HOME = "${OUT_DIR}/.cache/xdg"
TMPDIR = "${OUT_DIR}/.cache/tmp"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
