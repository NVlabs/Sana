implementation = "models/minimax_h3/optimized/cp_plan.py, passed to enable_parallelism(cp_plan=...) so the vendored diffusers stays pristine"
note = "Upstream ships no _cp_plan for MiniMax-H3. The block stack is the only shardable region: the forward scatters three per-modality streams into the packed buffer with global row indices and reverses that at the heads, so the sequence cannot be split at the model boundary."
note_efficiency = "denoise scales 3.45x of a theoretical 4x. The remaining 14% is all-to-all communication plus uneven sharding — 38247 is not divisible by 4, hence ulysses_anything."
note_amdahl = "End-to-end is 2.98x rather than 3.45x because VAE decode and host work do not shard."
note_memory = "Peak memory barely moved (144454 -> 144195 MiB): the peak is set by VAE decode, not the block stack, and VAE decode is replicated rather than sharded."
note_gpu_seconds = "Wall clock improves 2.98x but aggregate GPU time worsens 34% (160.6 -> 215.2 GPU-s): communication overhead plus VAE decode running redundantly on all four ranks. Irrelevant for latency-oriented deployment, a real target for throughput."

