refiner_batch_cfg = true
transformer_dtype = "bf16"
text_encoder_dtype = "bf16"
vae_dtype = "fp32"
refiner_vae_dtype = "fp32"

[baseline]
variant = "cp4_fsdp_batch_cfg_fa2"
run_id = "agent_opt_iter1_profile_4495666"
slurm_job_id = "4495666"
total_s = 375.55
load_excluded_request_s = 375.55
wall_total_s = 609.72
host_interval_base_pipeline_s = 89.09
