schema_version = 1
id = "hunyuan_diffusers"
display_name = "hunyuanvideo-community/HunyuanVideo"
legacy_profile = "models/hunyuan_diffusers.toml"
contract_kind = "model_baseline_minimal_copy"

[baseline]
manifest = "candidates/hunyuan_diffusers_baseline.toml"
runtime_root = "runtime/hunyuan_diffusers_baseline"
eval_profile = "evals/profiles/official_video_t2v_hunyuan.toml"
description = "Minimum runnable baseline closure for Hunyuan Diffusers experiments."

[baseline.copy]
paths_are_repo_relative = true
include = [
  "models/hunyuan_diffusers.toml",
  "models/hunyuan_diffusers/**",
  "runtime/hunyuan_diffusers_baseline/**",
  "candidates/hunyuan_diffusers_baseline.toml",
  "candidates/schema.md",
  "evals/profiles/official_video_t2v_hunyuan.toml",
  "evals/rubrics/gemini_visual_artifact_gate.md",
  "evals/tiers.toml",
  "scripts/launch_candidate.py",
  "scripts/collect_run.py",
  "search/plan_eval.py",
  "tools/vision/README.md",
  "tools/vision/lpips_judge.py",
  "tools/vision/nvidia_gemini_judge.py",
  "efficiency/candidate_manifest.py",
]
exclude = [
  ".git/**",
  "**/__pycache__/**",
  "**/*.pyc",
  "**/.pytest_cache/**",
  "runtime/hunyuan_diffusers_baseline/step_cache_runtime.py",
  "runs/**",
  "output/**",
  "candidates/kwl_fusion/**",
  "candidates/step_cache/**",
  "candidates/token_prune/**",
  "candidates/sparse_attention/**",
  "candidates/nvfp4_ffn/**",
  "search_space/**",
  "workflow/**",
]

[[baseline.reference_only]]
name = "model_weights_and_hf_cache"
env = ["HF_HOME", "HF_HUB_CACHE", "HUNYUAN_CACHE", "MODEL_REPO"]
reason = "Large external model state is shared by reference and must not be copied into experiments."

[[baseline.reference_only]]
name = "python_environment"
env = ["PYTHON_BIN"]
reason = "Conda/runtime environments are external dependencies, not experiment-local code."

[[baseline.reference_only]]
name = "runtime_caches"
env = ["TMPDIR", "TRITON_CACHE_DIR", "TORCH_EXTENSIONS_DIR"]
reason = "Each experiment receives fresh cache directories under its worktree."

[experiment_defaults]
worktree_mode = "model_baseline_minimal_copy"
experiments_root = "output/experiments"
state_dir = "state"
runs_dir = "runs"
logs_dir = "logs"
caches = ["tmp", "triton", "torch_extensions"]
