# MiniMaxH3VideoVAE. Architecture from FL2VA/video_vae/source/config.json;
# forward_kwargs from the component FL2VA/video_vae/config.json (its vae_*
# keys with the prefix stripped, which is what setup_forward() reads).
#
# Deviations from the released component config, both deliberate:
#   parallel_tiling: released 1 -> false. That path needs sglang's
#     decode-parallel state, which is not vendored (see the fence in klvae.py).
#   chunk_dim: dropped. setup_forward() does not read it.
# vae_ratio (16) and vae_ratio_t (4) are derived from space_down/time_down
# in the constructor and must not be passed.
causal_decoder: false
causal_encoder: true
ch: 128
ch_mult: [1, 2, 2, 4, 4, 8]
embed_dim: 24
in_channels: 3
num_res_blocks: 2
num_res_blocks_decoder: null
out_ch: 3
padding_mode: "reflect"
padding_mode_t: null
pixel_norm_type: "imagenet"
scaling_factor: 1.0
shift_factor: 0.0
space_down: [2, 2, 2, 2, 1, 1]
space_up: [1, 2, 2, 2, 2, 1]
time_down: [1, 2, 2, 1, 1, 1]
time_up: null
use_3d_conv: true
use_t_isolated_gn: true
use_vit_decoder: true
vit_decoder_kwargs:
  dim_head: 64
  ffn_activation_fn: "silu"
  ffn_use_gated: true
  heads: 32
  norm_affine: true
  norm_type: "rms_norm"
  num_layers: 36
  qk_norm_affine: false
  qk_norm_type: "rms_norm"
  rope_dim_ratio: 0.75
  rope_theta: 100.0
z_channels: 24
zq_ch_decoder: null
zq_ch_encoder: null
forward_kwargs:
  clip_length: 17
  token_drop: 3
  encoder_tiling: true
  decoder_tiling: true
  parallel_tiling: false
  tile_size: 256
  tile_overlap_min: 64
  encoder_parallel: false
  decoder_parallel: false
