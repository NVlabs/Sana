sage_attention = "sageattn3 1.0.0 — quantized attention"
nvfp4 = "transformer_engine 2.11.0 — FP4 quantization, Blackwell-native"
torch_compile = "Upstream states the current torch.compile path changes MiniMax-H3's numerical output; it cannot be reported as lossless without passing the quality gate first."

[acceleration.next_levers]
vae_decode = "Now 15% of the request (7.9 s of 53.8 s), up from 5% before CP, and it runs redundantly on all four ranks. Sharding the decode by temporal tile is a ~10% end-to-end opportunity and is topology work, not kernel work."
sparse_attention = "Attention is ~59% of the per-evaluation FLOPs at the measured 38247-token sequence. MiniMax-H3 natively supports sparse attention; the vendor shipped inference with full attention only and states the sparse implementation lands later."
adaln_precompute = "~13B of the 33B are AdaLN projections whose modulation outputs the vendor states can be precomputed and cached, removing them from the inference-resident set. Worth about 26 GB of weight reads per rank per step, which is only ~0.4% of an 888 ms step — a memory-residency win far more than a latency one."

[acceleration.line3_cache]
name = "first_block_cache"
status = "control_only"
kind = "approximation"
slurm_job_id = "5816129"
basis = "context_parallel_ulysses4 + native attention"
lossless_reference_request_s = 54.128
note = "Kept as a control, not as the deliverable: the requested methods are TeaCache and EasyCache, measured in [acceleration.line3b_step_cache]. FirstBlockCache is a simplification of TeaCache: same idea, a cheap per-step signal deciding whether to recompute, with the first block's residual as the signal instead of the modulated input. It is what diffusers ships in-tree and what the hook system integrates with."
note_evals = "dit_evals stays at 49 for every threshold and that is not a sign the cache is inert: FirstBlockCache skips the remaining blocks *inside* a forward, so the count of transformer calls cannot drop. denoise_gpu_s is the honest indicator — it falls from 44.2 s to 11.1 s."
note_quality = "Mean PSNR saturates near 16 dB from threshold 0.05 onward, but min-frame PSNR and audio MSE keep separating the configurations. Degradation is real and continuous past the point where the mean stops resolving it, so the mean must not be used to pick an operating point."
note_bottleneck = "At threshold 0.12 denoise is down to 11.1 s of a 24.2 s request: non-denoise work is 54% of the request, VAE decode about 8 s of it. The deeper the cache, the more the VAE decode dominates."
recommended = "none yet"
note_recommendation = "0.08 is the knee on the measured numbers — 0.05 to 0.08 buys 21% for 9% more audio error, while 0.08 to 0.12 buys only 10% for 59% more audio error and another 1.6 dB off the worst frame. No operating point is recommended until the LPIPS and VLM gates in the eval profile have run; PSNR and MSE gate regressions, they do not certify quality."

