<!doctype html>
<!-- Promo "product film" of the real Sol-H3 Studio (web/studio.js) with a virtual camera.
     Every frame is a pure function of t: window.renderFrame(part, t) runs the timed UI events
     up to t, moves the camera/cursor, and seeks the result video. Rendered by render_film.mjs.
     Serve the repository root over http (ES modules): python3 -m http.server 8777
     Media: python3 scripts/fetch_assets.py promo gallery (into assets/). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="../../../web/theme.css">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#07090b}
body{font-family:"Geist","Helvetica Neue",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
/* Deterministic frames: the Studio's own CSS motion is replaced by the film's timeline. */
.sh-studio,.sh-studio *,.sh-studio::backdrop{animation:none!important;transition:none!important}
#backdrop{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(70px) brightness(.42) saturate(1.25)}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(4,5,7,.75) 100%)}
#rig{position:absolute;inset:0;perspective:2400px;perspective-origin:50% 45%}
#tilt{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:960px 540px}
#stage{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0}
#stage .sh-studio{position:absolute;inset:0;width:1440px;height:810px;max-width:none;margin:0;
  box-shadow:0 60px 160px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.04)}
#stage .sh-stage{max-width:calc(480px * 1344 / 768)}
#stage .sh-result-bar{max-width:calc(480px * 1344 / 768)}
#fx{position:absolute;left:0;top:0;width:1440px;height:810px;pointer-events:none}
#cursor{position:absolute;left:0;top:0;width:22px;height:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
#ripple{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid #9be22d;opacity:0}
#card{position:absolute;left:0;top:0;width:336px;height:192px;border-radius:12px;overflow:hidden;opacity:0;
  box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.18);background-size:cover;background-position:center}
#wire{position:absolute;inset:0;overflow:visible}
#wire path{fill:none;stroke:#9be22d;stroke-width:2.2;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(155,226,45,.6))}
#wire circle{fill:#9be22d;opacity:0}
#speed{position:absolute;padding:5px 11px;border-radius:999px;background:rgba(155,226,45,.14);border:1px solid rgba(155,226,45,.5);
  color:#c8f27a;font:600 12px/1 "Geist Mono",ui-monospace,Menlo,monospace;letter-spacing:.02em;white-space:nowrap;opacity:0}
/* Film hover marks (the real :hover cannot be scripted per frame). */
.sh-pipeline[data-film-hover=true]{border-color:var(--sh-border-strong);color:var(--sh-ink)}
.sh-wall-item[data-film-hover=true]{border-color:var(--sh-accent-line)}
.sh-wall-item[data-film-hover=true] video{transform:scale(1.035)}
.sh-wall-item[data-film-hover=true] .sh-wall-caption{opacity:1;translate:0 0}
.sh-wall:has([data-film-hover=true]) .sh-wall-item:not([data-film-hover=true]) video{filter:brightness(.55) saturate(.8)}
/* Screen-space type. */
#intro{position:absolute;inset:0;display:grid;place-content:center;text-align:center;opacity:0}
#intro em:empty{display:none}
#intro em{display:block;margin-bottom:26px;font-style:normal;font-size:26px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#9be22d}
#intro h1{margin:0;font-size:104px;font-weight:800;letter-spacing:-.045em;line-height:1}
#intro p{margin:22px 0 0;font-size:32px;font-weight:600;color:rgba(255,255,255,.72)}
#caption{position:absolute;left:50%;bottom:40px;translate:-50% 0;display:flex;align-items:center;gap:18px;padding:14px 34px 14px 16px;
  border-radius:999px;background:rgba(243,246,238,.78);backdrop-filter:blur(14px);color:#0b0d10;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 6px rgba(155,226,45,.28);white-space:nowrap;opacity:0}
#caption b{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#76b900;color:#0b1200;font-size:25px;font-weight:800}
#caption span{font-size:38px;font-weight:750;letter-spacing:-.03em}
#caption small{font-size:26px;font-weight:600;color:#4a5361;letter-spacing:-.01em}
</style>
</head>
<body>
<div id="backdrop"></div><div id="vignette"></div>
<div id="intro"><em></em><h1></h1><p></p></div>
<div id="rig"><div id="tilt"><div id="stage">
  <div id="fx">
    <svg id="wire"><path d="" /><circle r="5" cx="-20" cy="-20"/></svg>
    <div id="card"></div>
    <div id="speed"></div>
    <div id="ripple"></div>
    <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2.5 19.5 13l-7 1.2 4.2 7.3-2.7 1.5-4.2-7.3L4 20.5z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
</div></div></div>
<div id="caption"></div>
<script type="module">
import { createStudio } from '../../../web/studio.js';

const SRC = '../../../assets/promo/studio-film/';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, p) => a + (b - a) * p;
const $ = s => document.querySelector(s);
const PROFILE = 'Sol-H3 one stage — RTX 5090';
const TWO = 'Sol-H3 two stage — RTX 5090';
const GALLERY = '../../../assets/gallery/';
const T2V_E2E = 193.589;
const EAGLE = 'integrated_multimodal_description: A wide aerial shot follows an eagle gliding over a turquoise alpine lake, with pine forest, a narrow waterfall and snow-covered peaks visible in the background. Its wings flex gently as it banks through the warm afternoon light. The camera maintains its distance and reveals the landscape in one continuous five-second shot. Natural colors, realistic feathers, no cuts or text. overall_soundscape: Wind moving through the valley, a distant eagle call and soft waterfall noise. non_diegetic_music: None.';
const CITADEL = 'The camera glides slowly forward through the great stone arch as the red-sailed airship drifts ahead between the towers; waterfalls tumble into the clouds and mist rolls beneath the city; warm sunlight flickers across copper domes. overall_soundscape: Deep wind across the cliffs, distant roaring waterfalls, creaking rigging of the airship. non_diegetic_music: A soaring orchestral swell.';
const PAST = ['pocketwatch-cathedral', 'whale-sky-temple', 'astronaut-ring', 'neon-rain-portrait', 'dragon-lantern-city', 'koi-lotus', 'desert-caravan', 'aurora-reindeer'];
// Result videos are preloaded as blob URLs: seeking must not depend on the server's Range support.
const MEDIA = {'citadel.png': SRC + 'citadel.png'};
for (const name of ['eagle.mp4', 'citadel.mp4']) MEDIA[name] = URL.createObjectURL(await (await fetch(SRC + name)).blob());
// The gallery wall: same listing and files the /solh3/gallery routes serve, preloaded the same way.
const WALL = await fetch(GALLERY + 'index.json').then(r => r.json());
const WALL_MEDIA = {};
for (const item of WALL) {
    WALL_MEDIA[item.video] = URL.createObjectURL(await (await fetch(GALLERY + item.video)).blob());
    if (item.image) WALL_MEDIA[item.image] = GALLERY + item.image;
}

// Deterministic clock for the Studio's elapsed counter.
performance.now = () => 0;
// Keep the dialog out of the top layer so the camera transform applies to it.
HTMLDialogElement.prototype.showModal = function () { this.setAttribute('open', ''); };

const query = new URLSearchParams(location.search);
const part = query.get('part') || 'a';
const TIMING = {one: Number(query.get('one')) || null, two: Number(query.get('two')) || null};
let library = (part === 'a' ? PAST.slice(0, 7) : ['eagle', ...PAST.slice(0, 7)]).map(id => ({
    id: `SolH3/${id}.mp4`, file: `${id}.mp4`, subfolder: 'SolH3', type: 'output', prompt: id, mode: 'text', profile: PROFILE,
    ...(id === 'eagle' ? {e2e_s: T2V_E2E} : {})}));
const thumb = id => SRC + (id.includes('pocketwatch') ? 'rail-pocketwatch.jpg' : id.includes('citadel.mp4') && !id.includes('sky-') ? 'rail-citadel.jpg' : id.includes('eagle') ? 'rail-eagle.jpg' : `rail-${id.split('/').pop().replace('.mp4', '')}.jpg`);
const listeners = new EventTarget();
const api = {
    apiURL(path) {
        const q = new URLSearchParams(path.split('?')[1] || '');
        if (path.startsWith('/solh3/library/thumbnail')) return thumb(q.get('id'));
        if (path.startsWith('/view')) return MEDIA[q.get('filename')] || MEDIA['eagle.mp4'];
        if (path.startsWith('/solh3/gallery/file')) return WALL_MEDIA[q.get('name')];
        return path;
    },
    async fetchApi(path) {
        const body = path.startsWith('/solh3/capabilities') ? {profiles: [
            {name: PROFILE, label: 'One stage', steps: 8, pipeline: 'one_stage', modes: ['text', 'first_frame', 'reference'],
             resolutions: ['768p', '480p'], latency_s: TIMING.one, default: true},
            {name: TWO, label: 'Two stage', steps: 7, pipeline: 'two_stage', modes: ['text'], resolutions: ['768p'],
             latency_s: TIMING.two, default: false}],
            device: {id: 'rtx5090', label: 'RTX 5090'}, gallery: true}
            : path.startsWith('/solh3/gallery') ? {items: WALL}
            : path.startsWith('/solh3/library') ? {items: library}
            : path.startsWith('/upload/image') ? {name: 'citadel.png', subfolder: ''}
            : path.startsWith('/solh3/progress') ? {progress: []} : {};
        return new Response(JSON.stringify(body), {headers: {'Content-Type': 'application/json'}});
    },
    addEventListener: (n, f) => listeners.addEventListener(n, f),
    removeEventListener: (n, f) => listeners.removeEventListener(n, f),
    async queuePrompt() { return {prompt_id: 'film'}; },
};
const w = (name, value, extra = {}) => ({name, value, ...extra});
const node = {id: 7, widgets: [w('profile', PROFILE, {options: {values: [PROFILE, TWO]}}), w('prompt', ''), w('seed', 42),
    w('control_after_generate', 'fixed'), w('keep_loaded', true), w('mode', 'text'), w('image', ''), w('backend', 'local'),
    w('resolution', '768p')]};
const studio = createStudio({app: {async graphToPrompt() { return {output: {}, workflow: {}}; }}, api});
studio.openStudio(node);
const dialog = $('.sh-studio');
$('#stage').prepend(dialog);
await new Promise(r => setTimeout(r, 400));
const S = studio.current;
const prompt = $('.sh-prompt textarea');
const video = $('.sh-player video');
video.controls = false; video.muted = true;
$('#backdrop').style.backgroundImage = `url(${SRC}rail-${part === 'a' ? 'whale-sky-temple' : 'citadel'}.jpg)`;

// ---- Geometry in stage-local px (camera removed while measuring).
const stage = $('#stage'), tilt = $('#tilt');
function rect(sel) {
    const e = typeof sel === 'string' ? $(sel) : sel;
    const saved = stage.style.transform, savedTilt = tilt.style.transform;
    stage.style.transform = 'none'; tilt.style.transform = 'none';
    const r = e.getBoundingClientRect();
    stage.style.transform = saved; tilt.style.transform = savedTilt;
    return {x: r.left, y: r.top, w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2};
}
const FULL = {cx: 720, cy: 405, s: 1920 / 1440};
const at = (sel, s, dx = 0, dy = 0) => () => { const r = rect(sel); return {cx: r.cx + dx, cy: r.cy + dy, s}; };
const fixed = v => () => v;

// ---- Timelines. cam: [t, target(), rotX, rotY]; cursor: [t, x, y]; events: [t, fn] run once in order.
const TL = {a: {
    D: 12.8,
    intro: ['One click in ComfyUI', 'Text to video', 'Write a prompt. Click Generate.'],
    label: [0.2, 12.6, 'Text to video'],
    callout: [8.2, 10.3, 'Request to MP4 in 3:13.', 'HyperFlow · 8 steps · with sound'],
    cam: [[0, fixed(FULL), 0, 0], [1.0, fixed(FULL), 0, 0], [1.9, at('.sh-prompt', 1.85, 40, 20), 0, -3],
          [3.9, at('.sh-prompt', 1.85, 40, 50), 0, -3], [4.7, at('.sh-generate', 1.65, 90, -60), 0, -2], [5.5, at('.sh-stage', 1.45), 0, 2],
          [7.9, at('.sh-stage', 1.5), 0, 2], [9.8, at('.sh-stage', 1.55), 0, 2], [11.0, fixed({...FULL, s: 1.25}), 0, 0], [12.8, fixed({...FULL, s: 1.23}), 0, 0]],
    cursor: [[0.6, 900, 560], [1.6, 230, 210], [3.9, 230, 230], [4.6, '.sh-generate'], [5.2, '.sh-generate'], [5.9, 1100, 700]],
    clicks: [1.65, 4.65],
    events: [[0.02, () => S.refreshRecent()], [2.0, () => ({type: 'typing', text: EAGLE, from: 2.0, to: 3.9})],
        [4.65, () => $('.sh-generate').click()],
        [4.8, () => ({type: 'progress', from: 4.8, to: 7.8, e2e: T2V_E2E})],
        [7.8, () => finish('eagle.mp4', T2V_E2E)]],
    video: 7.8,
}, b: {
    intro: ['', 'Sol-H3 Studio', 'One click in ComfyUI · local RTX 5090'],
    // Opens on the whole Studio and steps in through mode, prompt and pipeline; after Generate it returns to the
    // whole Studio, then opens the Gallery: every showcase clip playing at once.
    // The last ~4 film-seconds hold on the whole Gallery: make_promo.py blurs that tail under the end card.
    D: 26.4,
    captions: [[1.7, 4.6, '1', 'Pick a mode', 'text, first frame or reference'], [4.8, 6.6, '2', 'Describe the motion', 'and the sound'],
               [6.8, 9.0, '3', 'Choose a pipeline', 'one stage or two stage'], [9.2, 11.6, '4', 'Generate', 'on your own RTX 5090'],
               [11.8, 14.0, '✓', 'Your image, now in motion', 'with sound'],
               [14.6, 21.4, '', 'Every clip here', 'made with Sol-H3']],
    cam: [[0, fixed(FULL), 0, 0], [1.6, fixed(FULL), 0, 0], [2.4, at('.sh-modes', 1.8, 30, 70), 0, 3], [4.2, at('.sh-modes', 1.75, 30, 90), 0, 3],
          [5.0, at('.sh-prompt', 1.8, 40, 40), 0, -2], [6.5, at('.sh-prompt', 1.8, 40, 60), 0, -2],
          [7.2, at('.sh-pipelines', 1.75, 30, 0), 0, 2], [8.9, at('.sh-pipelines', 1.75, 30, 10), 0, 2],
          [9.5, at('.sh-generate', 1.7, 60, -90), 0, -1], [10.1, at('.sh-generate', 1.7, 60, -90), 0, -1],
          [11.0, fixed(FULL), 0, 0], [14.0, fixed(FULL), 0, 0],
          // Gallery: pull back over the wall, glide across it, settle on one clip.
          [14.6, fixed({...FULL, s: 1.3}), 0, 0], [17.4, fixed({cx: 600, cy: 400, s: 1.62}), 0, -3],
          [19.6, fixed({cx: 760, cy: 430, s: 1.62}), 0, 3], [22.4, fixed({...FULL, s: 1.34}), 0, 0],
          [26.4, fixed({...FULL, s: 1.26}), 0, 0]],
    cursor: [[1.4, 900, 520], [2.1, '.sh-modes [data-id=first_frame]'], [2.4, '.sh-modes [data-id=first_frame]'], [2.7, 1100, 330],
             [3.8, '.sh-drop'], [4.5, '.sh-drop'], [4.9, 230, 210], [6.5, 230, 230],
             [7.3, '.sh-pipeline:nth-child(2)'], [7.9, '.sh-pipeline:nth-child(2)'], [8.4, '.sh-pipeline:nth-child(1)'], [8.9, '.sh-pipeline:nth-child(1)'],
             [9.5, '.sh-generate'], [10.0, '.sh-generate'], [10.8, 1150, 620], [13.4, 1150, 620],
             [14.1, '.sh-switch-item:nth-child(2)'], [14.6, '.sh-switch-item:nth-child(2)'], [16.0, 520, 330], [18.4, 520, 340],
             [18.4, '.sh-wall-item:nth-child(7)'], [21.4, '.sh-wall-item:nth-child(7)'], [22.6, 1500, 880], [26.4, 1500, 880]],
    clicks: [2.15, 4.95, 8.6, 9.75, 14.4],
    events: [[0.02, () => S.refreshRecent()], [2.15, () => $('.sh-modes [data-id=first_frame]').click()],
        [2.6, () => ({type: 'card', from: 2.6, to: 3.85})],
        [3.85, async () => {
            const blob = await (await fetch(SRC + 'citadel.png')).blob();
            const dt = new DataTransfer(); dt.items.add(new File([blob], 'citadel.png', {type: 'image/png'}));
            $('.sh-drop').dispatchEvent(new DragEvent('drop', {dataTransfer: dt, bubbles: true, cancelable: true}));
            await new Promise(r => setTimeout(r, 300));
            await Promise.all([...document.querySelectorAll('.sh-thumb img')].map(i => i.decode().catch(() => {})));
        }],
        [5.0, () => ({type: 'typing', text: CITADEL, from: 5.0, to: 6.5})],
        [6.6, () => ({type: 'scroll', sel: '.sh-controls-scroll', to: '.sh-pipelines', from: 6.6, until: 7.2})],
        [7.9, () => ({type: 'hover', sel: '.sh-pipeline:nth-child(2)', from: 7.9, to: 8.4})],
        [9.1, () => ({type: 'scroll', sel: '.sh-controls-scroll', to: null, from: 9.1, until: 9.5})],
        [8.6, () => $('.sh-pipeline:nth-child(1)').click()],
        [9.75, () => $('.sh-generate').click()],
        [9.9, () => ({type: 'progress', from: 9.9, to: 12.0, slowStart: true, e2e: TIMING.one})],
        [12.0, () => finish('citadel.mp4', TIMING.one)],
        [14.4, async () => { S.showTab('gallery'); await new Promise(r => setTimeout(r, 400)); }],
        [14.5, () => ({type: 'wall', from: 14.4})],
        [18.6, () => ({type: 'hover', sel: '.sh-wall-item:nth-child(7)', from: 18.6, to: 21.6})]],
    video: 12.0,
}}[part];

// Continuous effects started by events.
const live = [];
let done = 0;
function camAt(t) {
    const k = TL.cam; let i = k.findIndex(f => f[0] > t); if (i < 0) i = k.length; if (i === 0) i = 1;
    if (i >= k.length) { const l = k[k.length - 1]; return {...l[1](), rx: l[2], ry: l[3]}; }
    const a = k[i - 1], b = k[i], p = ease((t - a[0]) / (b[0] - a[0])), A = a[1](), B = b[1]();
    return {cx: lerp(A.cx, B.cx, p), cy: lerp(A.cy, B.cy, p), s: lerp(A.s, B.s, p), rx: lerp(a[2], b[2], p), ry: lerp(a[3], b[3], p)};
}
function point(spec) { if (typeof spec[1] === 'string') { const r = rect(spec[1]); return [r.cx + 8, r.cy + 6]; } return [spec[1], spec[2]]; }
function cursorAt(t) {
    const k = TL.cursor; if (t < k[0][0]) return null;
    let i = k.findIndex(f => f[0] > t); if (i < 0) return point(k[k.length - 1]);
    const A = point(k[i - 1]), B = point(k[i]), p = ease((t - k[i - 1][0]) / (k[i][0] - k[i - 1][0]));
    return [lerp(A[0], B[0], p), lerp(A[1], B[1], p)];
}
function fade(el, t, [a, b], d = .45) { const o = Math.min(out((t - a) / d), 1 - out((t - (b - d)) / d)); el.style.opacity = clamp(o); return o; }
const emit = (name, detail) => listeners.dispatchEvent(new CustomEvent(name, {detail}));
function finish(file, e2e) {
    emit('executed', {node: 7, prompt_id: 'film', output: {text: [JSON.stringify({e2e_s: e2e, profile: PROFILE, seed: 42})],
        solh3_video: [{filename: file, subfolder: 'SolH3', type: 'output'}]}});
    library = [{...library[0], id: `SolH3/${file}`, file, e2e_s: e2e}, ...library].slice(0, 8);
    return S.refreshRecent();
}
function progressAt(t, f) {
    const x = clamp((t - f.from) / (f.to - f.from)), p = f.slowStart ? Math.pow(x, 2.2) : x;
    const total = f.e2e || null, e = total ? total * p : null;
    let m;
    if (p < .08) m = {stage: 'conditioning', message: 'Qwen · NVFP4'};
    else if (p < .9) { const step = Math.min(8, 1 + Math.floor((p - .08) / .82 * 8)); m = {stage: 'denoising', step, steps: 8, message: 'One stage · 8-step LoRA'}; }
    else m = {stage: 'decoding', message: 'Video + audio'};
    emit('solh3_progress', {...m, node: 7, prompt_id: 'film', elapsed_s: e ?? 0});
    const stat = $('.sh-progress-stats span:last-child');
    stat.textContent = total ? (e < 60 ? `${e.toFixed(1)} s` : `${Math.floor(e / 60)}:${String(Math.floor(e % 60)).padStart(2, '0')}`) : '';
    const card = $('.sh-progress'), sp = $('#speed');
    if (card && !card.hidden) {
        const r = rect(card); sp.style.left = `${r.x}px`; sp.style.top = `${r.y - 34}px`;
        sp.textContent = total ? `TIME-LAPSE · ${Math.round(total / (f.to - f.from))}×` : 'TIME-LAPSE';
        sp.style.opacity = clamp(out((t - f.from) / .3));
    }
}

// Each part opens on a held title naming the feature; the UI timeline starts after it.
const HOLD = 1.9, SLOW = 1.2;
window.renderFrame = async T => {
    const t = Math.max(0, (T - HOLD) / SLOW);
    // Timed events, once each, in order.
    while (done < TL.events.length && TL.events[done][0] <= t) {
        const r = await TL.events[done][1](); if (r && r.type) live.push(r); done++;
    }
    for (const f of live) {
        if (f.type === 'typing') {
            const n = Math.round(f.text.length * out((t - f.from) / (f.to - f.from)));
            if (prompt.value.length !== n) { prompt.value = f.text.slice(0, n); prompt.dispatchEvent(new Event('input')); }
            prompt.scrollTop = prompt.scrollHeight;
        }
        if (f.type === 'progress') { if (t < f.to) progressAt(t, f); else $('#speed').style.opacity = 0; }
        if (f.type === 'scroll') {
            // Scroll a container to bring `to` to its top (or back to 0), eased over [from, until].
            const box = $(f.sel);
            if (f.start == null) { f.start = box.scrollTop; f.end = f.to ? box.scrollTop + $(f.to).getBoundingClientRect().top - box.getBoundingClientRect().top - 12 : 0; }
            box.scrollTop = lerp(f.start, f.end, ease((t - f.from) / (f.until - f.from)));
        }
        if (f.type === 'hover') {
            // A real :hover cannot be driven frame by frame; mark the element so the film CSS lights it.
            const e = $(f.sel); if (e) e.dataset.filmHover = String(t >= f.from && t < f.to);
            if (e?.classList.contains('sh-wall-item')) e.dataset.sound = String(t >= f.from && t < f.to);
        }
        if (f.type === 'wall') {
            // Every wall clip plays in real time from the moment the Gallery opens: seek each to the film clock.
            const local = Math.max(0, (T - HOLD) - f.from * SLOW);
            await Promise.all([...document.querySelectorAll('.sh-wall-item video')].map((v, i) => {
                v.autoplay = false; if (!v.paused) v.pause();
                if (v.readyState < 1) return new Promise(r => { v.addEventListener('loadeddata', r, {once: true}); setTimeout(r, 4000); });
                const target = (local + i * 0.37) % Math.max(0.1, (v.duration || 5) - 0.05);
                if (Math.abs(v.currentTime - target) < 1e-3) return null;
                return new Promise(r => { v.addEventListener('seeked', r, {once: true}); v.currentTime = target; setTimeout(r, 3000); });
            }));
        }
        if (f.type === 'card') {
            const card = $('#card'); card.style.backgroundImage = `url(${SRC}citadel.png)`;
            const d = rect('.sh-drop'), p = ease((t - f.from) / (f.to - f.from));
            const s = lerp(1.25, d.h / 192 * 0.9, p), x = lerp(1180, d.cx, p), y = lerp(250, d.cy, p);
            card.style.transform = `translate(${x - 168}px,${y - 96}px) scale(${s}) rotate(${lerp(-6, 0, p)}deg)`;
            card.style.opacity = t < f.to ? clamp(out((t - f.from) / .25)) : 0;
            $('.sh-drop').dataset.over = String(p > .7 && t < f.to);
        }
        if (f.type === 'wire') {
            const a = rect('.sh-thumb'), b = rect('.sh-stage'), path = $('#wire path');
            const x1 = a.x + a.w, y1 = a.cy, x2 = b.x, y2 = b.cy;
            path.setAttribute('d', `M${x1},${y1} C${x1 + 140},${y1} ${x2 - 160},${y2} ${x2},${y2}`);
            const L = path.getTotalLength(), p = out((t - f.from) / (f.to - f.from));
            path.style.strokeDasharray = `${L}`; path.style.strokeDashoffset = `${L * (1 - p)}`;
            const q = path.getPointAtLength(L * p), dot = $('#wire circle'); dot.setAttribute('cx', q.x); dot.setAttribute('cy', q.y);
            const o = 1 - clamp((t - f.to - .9) / .6); path.style.opacity = o; dot.style.opacity = o;
        }
    }
    // Video: real-time playback from its reveal.
    if (t >= TL.video && video.src) {
        if (video.readyState < 2) await new Promise(r => { video.addEventListener('loadeddata', r, {once: true}); setTimeout(r, 4000); });
        const target = Math.min(T - HOLD - TL.video * SLOW, (video.duration || 5) - .05);
        if (Math.abs(video.currentTime - target) > 1e-3) {
            await new Promise(r => { video.addEventListener('seeked', r, {once: true}); video.currentTime = target; setTimeout(r, 3000); });
        }
    }
    // Camera.
    const c = camAt(t);
    stage.style.transform = `translate(${960 - c.cx * c.s}px,${540 - c.cy * c.s}px) scale(${c.s})`;
    tilt.style.transform = `rotateX(${c.rx}deg) rotateY(${c.ry}deg)`;
    const intro = $('#intro');
    {
        // Title rises in, holds, then lifts away as the Studio window rises up under it.
        const inP = out(T / .5), outP = ease((T - HOLD + .1) / .8);
        intro.style.opacity = clamp(inP * (1 - outP));
        intro.style.transform = `translateY(${(1 - inP) * 24 - outP * 120}px) scale(${1 - outP * .06})`;
        const up = ease((T - HOLD + .2) / 1.0);
        dialog.style.opacity = clamp(up * 1.4);
        dialog.style.transform = `translateY(${(1 - up) * 140}px)`;
    }
    // Cursor + click ripple.
    const cur = cursorAt(t), cursor = $('#cursor'), ripple = $('#ripple');
    cursor.style.opacity = cur ? 1 : 0;
    if (cur) cursor.style.transform = `translate(${cur[0]}px,${cur[1]}px) scale(${1 / Math.max(1, c.s / 1.6)})`;
    const click = TL.clicks.find(k => t >= k && t < k + .45);
    if (click != null && cur) {
        const p = (t - click) / .45; ripple.style.left = `${cur[0]}px`; ripple.style.top = `${cur[1]}px`;
        ripple.style.opacity = 1 - p; ripple.style.transform = `scale(${.4 + p})`;
    } else ripple.style.opacity = 0;
    // Screen-space type.
    const cap = $('#caption'), now = (TL.captions || []).find(c => t >= c[0] - .3 && t < c[1] + .3);
    if (now) { cap.innerHTML = `${now[2] ? `<b>${now[2]}</b>` : ''}<span>${now[3]}</span><small>${now[4]}</small>`; fade(cap, t, [now[0], now[1]], .3);
               cap.style.transform = `translateY(${(1 - out((t - now[0]) / .35)) * 16}px)`; } else cap.style.opacity = 0;
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
};
const [eyebrow, title, sub] = TL.intro;
$('#intro em').textContent = eyebrow; $('#intro h1').textContent = title; $('#intro p').textContent = sub;
await document.fonts.ready;
window.filmReady = +(TL.D * SLOW + HOLD).toFixed(2);
</script>
</body>
