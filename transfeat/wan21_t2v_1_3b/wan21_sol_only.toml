id = "wan21_sol_only"
kind = "patch"
purpose = "optimization"
description = "Wan2.1-T2V-1.3B Sol-Attn only at tau 1.0 with global Morton3D order and dense guards for the first layer and first 10 steps."
model_profile = "wan21_t2v_1_3b"

[runtime]
root = "models/wan21_t2v_1_3b/optimized"

[env]
WAN22_KERNEL_STACK = ""
WAN22_KERNEL_LEDGER = "1"
WAN22_COMPILE_MODE = "max-autotune-no-cudagraphs"
WAN22_COMPILE_FULLGRAPH = "0"
WAN22_SOL_ATTN = "1"
WAN22_SOL_TAU = "1.0"
WAN22_SOL_THRESH_TYPE = "diag"
WAN22_SOL_KV_SPLITS = "auto"
WAN22_SOL_DENSE_STEPS = "10"
WAN22_SOL_DENSE_LAYERS = "0"
WAN22_SOL_REORDER = "1"
TORCHINDUCTOR_CACHE_DIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/wan21_t2v_1_3b/torch_inductor"
TRITON_CACHE_DIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/wan21_t2v_1_3b/triton"
TORCH_HOME = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/wan21_t2v_1_3b/torch"
XDG_CACHE_HOME = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/wan21_t2v_1_3b/xdg"
TMPDIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/wan21_t2v_1_3b/tmp"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
