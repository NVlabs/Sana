final_seed:
  goal: Build a local task management CLI for adding, listing, completing, and deleting personal tasks.
  constraints:
    - Runs locally from the command line.
    - Does not require a database server.
    - Stores task data in a human-readable local JSON file.
    - Excludes cloud sync, team collaboration, notifications, and user accounts.
  acceptance_criteria:
    - A user can add a task with a title from the command line.
    - A user can list open tasks and completed tasks.
    - A user can mark an existing task as complete.
    - A user can delete an existing task.
    - Task data persists after the CLI process exits.
  ontology:
    idea: Build a local task management CLI for adding, listing, completing, and deleting personal tasks.
    boundary: Personal local task tracking only; team workflows, cloud sync, reminders, and accounts are outside the boundary.
    properties:
      - task records
      - local persistence
      - command-line actions
cycles: 2
final_similarity: 0.91
stop_reason: convergence
