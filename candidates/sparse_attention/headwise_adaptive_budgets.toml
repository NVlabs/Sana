kind = "env_only"
purpose = "blocker_probe"
description = "Pure SpargeAttn-style per-head top-k budget block-map policy on the generic sparse-attention adapter."
model_profile = "cosmos3"

[id]
name = "headwise_adaptive_budgets"
dimension = "sparse_attention"
family = "spargeattn_headwise_topk_budget"

[references.external]
paper = "SpargeAttn paper: https://arxiv.org/html/2502.18137v1"
code = "SpargeAttn: https://github.com/thu-ml/SpargeAttn"
notes = "Uses SpargeAttn's public per-head hyperparameter/top-k block-map surface in a dependency-light pure Torch core; the local budget proposal can be replaced by offline tuning data without changing the public mean-sim block-map boundary."

[references.local]
generic_impl = "techniques/transforms/sparse_attention.py"

[requirements]
capabilities = ["has_attention_layers", "has_spatiotemporal_token_layout", "has_attention_backend_switch"]

[adapter]
model_spec = "Cosmos3"

[efficiency]
kind = "build_transform"
name = "sparse_attention"

[efficiency.params]
sparsity = 0.9
block_size = 64
component = "transformer"
route_mode = "headwise_adaptive_budgets"
dense_fallback = "fa"
stage2_dense_layers = "0-1"

[env]
SGLANG_HQ_CANDIDATE_ID = "headwise_adaptive_budgets"
SGLANG_HQ_SPARSE_ATTENTION_PATTERN = "headwise_adaptive_budgets"

[verification]
mode = "gpu"
allow_non_bit_exact = true
quality_gate = "baseline-comparable"
