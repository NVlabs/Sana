[acceleration.line2_kernel.why_default_wins]
explanation = "`native` dispatches through F.scaled_dot_product_attention, which selects a kernel at runtime from the shapes it is given. Pinning a specific backend removes that freedom, and none of the pinned choices matches what the dispatcher picks."

[acceleration.excluded]
