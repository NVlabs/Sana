id = "wan21_14b_fullstack_tuned"
kind = "patch"
purpose = "optimization"
description = "Wan2.1-T2V-14B 720p FULL STACK TUNED: 14B lossless kernel stack + EasyCache + SOL Attention (colmask kernel + global Morton3D reorder, density 0.15, dense guard first-layer+first-10-steps). Single-GPU."
model_profile = "wan21_t2v_14b"

[runtime]
root = "models/wan21_t2v_14b/optimized"

[env]
WAN22_KERNEL_STACK = "regional_compile,qkv_fusion,invariant_cache_v2,cross_kv_cache"
WAN22_KERNEL_LEDGER = "1"
WAN22_COMPILE_MODE = "max-autotune-no-cudagraphs"
WAN22_COMPILE_FULLGRAPH = "0"
WAN22_CACHE_FAMILY = "easycache"
WAN22_EASYCACHE_THRESHOLD = "0.10"
WAN22_EASYCACHE_RETAIN_STEPS = "5"
WAN22_SOL_ATTN = "1"
WAN22_SOL_DENSITY = "0.15"
WAN22_SOL_DENSE_STEPS = "10"
WAN22_SOL_DENSE_LAYERS = "0"
WAN22_SOL_REORDER = "1"
PISA2_ALLOW_LOW_TAU = "1"
TORCHINDUCTOR_CACHE_DIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/wan21_t2v_14b/torch_inductor"
TRITON_CACHE_DIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/wan21_t2v_14b/triton"
TORCH_HOME = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/wan21_t2v_14b/torch"
XDG_CACHE_HOME = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/wan21_t2v_14b/xdg"
TMPDIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/caches/wan21_t2v_14b/tmp"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
