# Search dimension: KWL operator fusion  (MODEL-AGNOSTIC)
#
# This dimension declares the generic KWL build transform and a small flag
# ablation space. It never names a model. The search composes each flag bundle
# against the target model's ModelSpec; per-model build wiring is tracked in
# models/<id>.toml seam_status.

id = "kwl_fusion"
title = "KWL operator-fusion flag bundle"
kind = "build_transform"
exclusive_seam = "kernel_fusion"
requires_capabilities = []

[[technique]]
