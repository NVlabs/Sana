teacache_calibration = "Fit the per-model polynomial from one reference trajectory — record rel-L1 of the modulated input against rel-L1 of the block-stack output over 50 steps and fit degree 4. Until then TeaCache is being judged without the component that makes it work."
easycache_cliff = "The high-fidelity window is narrow: 12 skipped steps holds 37 dB, 20 skipped steps falls to 18 dB. Thresholds between 0.20 and 0.30 would map where it breaks."
vae_decode = "With the cache engaged the VAE decode is the largest remaining item and it runs redundantly on all four ranks. Sharding it by temporal tile is the next lever, and unlike the DiT lines it is untouched."

