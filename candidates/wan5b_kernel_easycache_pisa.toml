id = "wan5b_kernel_easycache_pisa"
kind = "patch"
purpose = "delivery"
description = "Wan2.2 TI2V-5B: verified exact kernel stack + EasyCache 0.036 + PISA sparse self-attention (density 0.10). Single-GPU. Adds the previously-missing attention method on top of the delivered kernel+cache OPT."
model_profile = "wan22_ti2v_5b"

[runtime]
root = "models/wan22_ti2v_5b/optimized"

[env]
WAN22_KERNEL_STACK = "regional_compile,qkv_fusion,invariant_cache_v2,cross_kv_cache,bf16_block_glue"
WAN22_KERNEL_ACTIVE_CANDIDATE = ""
WAN22_KERNEL_LEDGER = "1"
WAN22_KERNEL_PAIR_BENCH = "0"
WAN22_KERNEL_PROFILE = "0"
WAN22_INTEGRATED_GENERATION_PAIR = "0"
WAN22_CUDAGRAPH_MARK_STEP = "0"
WAN22_COMPILE_MODE = "max-autotune-no-cudagraphs"
# Relaxed to 0 so regional_compile graph-breaks cleanly at the PISA triton kernel
# instead of erroring on a non-traceable custom op.
WAN22_COMPILE_FULLGRAPH = "0"
WAN22_CACHE_FAMILY = "easycache"
WAN22_EASYCACHE_THRESHOLD = "0.036"
WAN22_EASYCACHE_RETAIN_STEPS = "7"
WAN22_EASYCACHE_COOLDOWN_STEPS = "1"
WAN22_STEPS = "50"
WAN22_PISA_DENSITY = "0.10"
WAN22_PISA_BLOCK_SIZE = "64"
WAN22_PISA_DENSE_LAYERS = "0-3,26-29"
WAN22_PISA_DENSE_STEPS = "0-3,47-49"
WAN22_PISA_KERNEL_NUM_STAGES = "2"
WAN22_PISA_APPROX_REMAINDER = "1"
WAN22_NUM_PROMPTS = "5"
WAN22_WARMUP_PASSES = "2"
TORCHINDUCTOR_CACHE_DIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/orchestrated/wan5b-20260706-130525/caches/torch_inductor"
TRITON_CACHE_DIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/orchestrated/wan5b-20260706-130525/caches/triton"
TORCH_HOME = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/orchestrated/wan5b-20260706-130525/caches/torch"
XDG_CACHE_HOME = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/orchestrated/wan5b-20260706-130525/caches/xdg"
TMPDIR = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/orchestrated/wan5b-20260706-130525/caches/tmp"
TMP = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/orchestrated/wan5b-20260706-130525/caches/tmp"
TEMP = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/agent_deploy/Sol-LTX-Infer/output/orchestrated/wan5b-20260706-130525/caches/tmp"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
quality = "quality.json"

[slurm]
job_name = "wan5b-kernel-easycache-pisa"
time = "02:00:00"

[verification]
mode = "gpu"
allow_non_bit_exact = true
quality_gate = "user_visual_review"
