id = "minimax_h3_gb10_baseline"
kind = "baseline"
purpose = "control"
description = "MiniMax-H3 on one GB10 with no acceleration: pruned FP8 checkpoint read into upstream Modular Diffusers, eager quantiser, no fused kernels, no cache, no sparse attention. The FP8 weights are the substitution that makes the model fit at all, not an optimisation — measured at 13,428 ms/step against the released BF16 model's 13,417 ms, a 0.08% difference."
model_profile = "minimax_h3"
submodule = "models/minimax_h3/GB10"
run_script = "run_minimax_h3_gpu.sh"

[runtime]
root = "models/minimax_h3/GB10"

[env]
H3_PROMPT_FILE = "models/minimax_h3/demo_prompt.json"
H3_HEIGHT = "480"
H3_WIDTH = "832"
H3_NUM_FRAMES = "124"
H3_STEPS = "50"
H3_SEED = "0"
H3_WARMUP = "1"
H3_MEASURE = "1"
H3_KERNEL_FUSIONS = "0"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
quality = "quality.json"

[notes]
summary = "The denominator for every row below. It is not the GB200 baseline and cannot be compared to it: different hardware, different checkpoint, a tenth of the canvas."
