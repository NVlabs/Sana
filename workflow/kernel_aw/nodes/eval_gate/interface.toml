name = "eval_gate"
kind = "orchestration"
callable_by = ["workflow/kernel_aw/workflow.py"]
description = "Require smooth single-DiT/module-level evidence; never run full diffusion or make discard decisions."

inputs = ["AGENT-STATUS.json", "runs/*/gate_assess.json", "runs/*/dit_eval.json"]
outputs = ["gate_assess.json or dit_eval.json"]
outcomes = ["smooth", "missing", "infra_blocked", "policy_violation", "failed"]
side_effects = ["may_read_status"]
