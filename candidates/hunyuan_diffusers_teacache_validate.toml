id = "hunyuan_diffusers_teacache_validate"
kind = "methodology"
purpose = "evidence"
description = "TeaCache seam GPU validation + threshold calibration on HunyuanVideo (reconstructed runtime). Knobs are UNTUNED first-pass values; the run logs per-step rel_l1 into benchmark.json[seam][trace]."
model_profile = "hunyuan_diffusers"

# Same reconstructed runtime as the baseline; the seam (step_cache_runtime.py) is
# activated by the SGLANG_HQ_TEACACHE_* env below (absent => byte-identical baseline).
[runtime]
root = "runtime/hunyuan_diffusers_baseline"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
quality = "quality.json"
risk_notes = "risk_notes.md"
collection = "collection.json"
patch_summary = "patch_summary.md"

# TeaCache seam knobs — UNTUNED first-validation values. Merged over the profile
# [env] (keeps MODEL_REPO / HUNYUAN_* / HF_* / PYTHON_BIN). plan_eval's
# _RUNTIME_TECHNIQUE_ENV["teacache"] uses these same var names.
[env]
SGLANG_HQ_TEACACHE_THRESHOLD = "0.1"
SGLANG_HQ_TEACACHE_START_STEP = "6"
SGLANG_HQ_TEACACHE_MAX_HITS = "2"
