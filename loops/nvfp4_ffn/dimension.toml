# Search dimension: NVFP4 FFN quantization (MODEL-AGNOSTIC)
#
# Metadata for the low-precision FFN exploration dimension. Native subagents
# start from search_space/ and inspect the target model inference code directly;
# this file is not a fixed hyperparameter grid.

id = "nvfp4_ffn"
title = "NVFP4 FFN quantization (load-time video FFN precision transform)"
kind = "build_transform"

[[technique]]
name = "nvfp4_ffn"
search_axes = [
  "module scope",
  "precision format",
  "TE recipe flags",
  "FP4 GEMM backend",
  "fused TE epilogue path",
  "dense guard layers",
  "dense guard steps",
  "row padding policy",
  "fallback and calibration policy",
  "hardware/runtime preflight",
]

# Eval binding (model-agnostic; the model profile supplies the baseline to beat).
[eval]
profile = "evals/profiles/official_video_t2v.toml"
min_speedup_for_experimental = 1.03
min_speedup_for_promotion = 1.10

[loop]
granularity = "per_module"                       # axis this dimension searches: per_step | per_module | per_strategy
objective = ["min_latency", "min_peak_mem"]  # improvement vs models/<id>.toml [baseline]; either counts
max_iters = 40                           # search budget per dimension (hyperparameter)
early_stop_patience = 0                  # fixed-budget frontier mode; 0 disables patience early stop
keep = "frontier_candidates"             # keep candidates that improve quality OR speed/memory
tiers = "evals/tiers.toml"               # speed targets: low=1.5x, medium=2.0x, high=3.0x
# Retain a candidate during the 40-iteration loop if quality improves OR latency/peak_mem improves.
# Discard it when quality does not improve and speed/memory does not improve or regresses.
# Structured-negative is logged as a proposal/failure signature; it does not stop this default loop.
# Reliable numeric/precision checks may be hard gates; final ranking still uses Gemini+LPIPS.
# After the loop, the main agent selects 1.5x/2.0x/3.0x winners by Gemini+LPIPS quality ranking.
