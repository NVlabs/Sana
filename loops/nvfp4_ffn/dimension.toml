# Search dimension: NVFP4 FFN quantization (MODEL-AGNOSTIC)
#
# A dimension declares a transform plus its param search space. It never names a
# target model; the search composes each config against the selected ModelSpec.
# The model profile owns per-model loader/seam status in models/<id>.toml.

id = "nvfp4_ffn"
title = "NVFP4 FFN quantization (load-time video FFN precision transform)"
kind = "build_transform"
exclusive_seam = "ffn_precision"
requires_capabilities = []

[[technique]]
name = "nvfp4_ffn"
[technique.search_space]
disable_rht = [true, false]
disable_stochastic_rounding = [true, false]
disable_2d_quantization = [true, false]

# LTX-2.3 proven config = prior the search seeds from (provenance in reference/nvfp4_ffn/).
[[seeds]]
technique = "nvfp4_ffn"
note = "LTX-2.3 best selective NVFP4 video-FFN recipe"
params = { disable_rht = true, disable_stochastic_rounding = true, disable_2d_quantization = true }

# Eval binding (model-agnostic; the model profile supplies the baseline to beat).
[eval]
profile = "evals/profiles/official_video_t2v.toml"
min_speedup_for_experimental = 1.03
min_speedup_for_promotion = 1.10

[loop]
granularity = "per_module"                       # axis this dimension searches: per_step | per_module | per_strategy
objective = ["min_latency", "min_peak_mem"]  # improvement vs models/<id>.toml [baseline]; either counts
max_iters = 20                           # search budget per dimension (hyperparameter)
early_stop_patience = 5                  # stop after this many iters with no Pareto improvement
keep = "best_per_tier"                   # keep the best (latency, peak_mem) config in EACH risk tier
tiers = "evals/tiers.toml"               # quality budgets that define low / medium / high
# A candidate counts only if it (a) beats baseline on latency or peak_mem AND (b) meets a
# tier's quality budget; it is binned into the loosest tier it satisfies. Quality is a hard,
# per-tier constraint (never trade quality for speed beyond the tier budget).
