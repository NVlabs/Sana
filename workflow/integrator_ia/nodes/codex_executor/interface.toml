name = "codex_executor"
kind = "agent"
owned_by = "integrator_ia"
callable_by = ["workflow/integrator_ia/workflow.py"]
description = "Port and compose pinned kernel, PISA, and cache deliveries inside one isolated integration experiment."

inputs = ["state/integration-source-inventory.json", "goal.md", "STOP_HOOK_RESUME.md"]
outputs = ["INTEGRATION-SOURCES.lock.json", "INTEGRATION-STATUS.json", "COMPOSITION-MATRIX.json", "INTEGRATION-SUMMARY.md", "INTEGRATION-DELIVERY.json"]
outcomes = ["exited", "failed"]
forbidden = ["mutate_donor_worktree", "cross_workflow_node_import", "silent_component_disable", "self_author_visual_verdict"]
