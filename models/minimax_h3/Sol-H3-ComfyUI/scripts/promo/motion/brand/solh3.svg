<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sol-H3">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2128"/><stop offset="1" stop-color="#0d1014"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8f75a"/><stop offset="1" stop-color="#6aa800"/></linearGradient>
    <clipPath id="disc"><circle cx="35" cy="31" r="16"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="14.4" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.2"/>
  <!-- Sol: a sun whose lower half is sliced into three speed bands (H3, fast), trailing left. -->
  <g clip-path="url(#disc)">
    <rect x="15" y="10" width="40" height="42" fill="url(#sun)"/>
    <rect x="15" y="31" width="40" height="2.4" fill="#0d1014"/>
    <rect x="15" y="37" width="40" height="3" fill="#0d1014"/>
    <rect x="15" y="43.4" width="40" height="3.6" fill="#0d1014"/>
  </g>
  <rect x="9" y="34.6" width="17" height="1.6" rx=".8" fill="#9be22d" opacity=".55"/>
  <rect x="12" y="41" width="13" height="1.6" rx=".8" fill="#9be22d" opacity=".38"/>
  <rect x="15" y="47.4" width="9" height="1.6" rx=".8" fill="#9be22d" opacity=".22"/>
</svg>
