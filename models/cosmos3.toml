# Model profile for Cosmos3 runtime defaults.
#
# Config manifests declare required capabilities; dry-run validation creates
# a minimal manifest-derived ModelSpec rather than importing a built-in
# per-model spec file. Runtime-specific glue stays in Sol-LTX-Infer.

id = "cosmos3"
spec = "Cosmos3"                 # descriptive target label in generated metadata
display_name = "nvidia/Cosmos3-Super"
family = "video_t2v"
# submodule is the vendored runtime dir, and run_script is resolved relative to
# the config's [runtime].root -- NOT repo-relative. Both arms name their shim
# identically, so the same run_script value selects baseline or optimized purely
# by which [runtime].root the config points at. There is no separate
# "optimized_run_script" key; nothing reads one.
submodule = "models/cosmos3/baseline"
run_script = "scripts/run_cosmos3_gpu.sh"
eval_profile = "evals/profiles/official_video_t2v_cosmos3.toml"
model_contract = "models/cosmos3/model.toml"
# No base_commit: launch_config.py compares it against the *submodule's* git
# commit, and the submodule is this repo's vendored arm. The Sol-LTX-Infer pin
# lives in models/cosmos3/model.toml as [[baseline.reference_only]].commit.
#
# That pin was moved off 29d0d9e464000a2472345dcad51054b15aacca8d
# ("run_cosmos3_sglang.sh: make env paths overridable", 2026-06-13), which sits
# on no branch in Efficient-Large-Model/Sol-LTX-Infer — `git branch -r --contains`
# is empty for it, so a plain `git fetch` never brings it down and every checkout
# on the fleet reported it as a bad object. It is still retrievable by explicit
# SHA (`git fetch <remote> 29d0d9e4...`); it just should not be what a profile
# points at. elm/v1_formal (b0b7eb4d0) carries scripts/ltx/ and scripts/cosmos/
# in the layout the site docs reference.

[official_config]
model = "nvidia/Cosmos3-Super"
width = 1280
height = 720
frames = 189
fps = 24
steps = 35
guidance_scale = 6.0
flow_shift = 10.0
max_sequence_length = 4096
seed = 42
num_gpus = 4

[baseline]
run_id = "20260612-175151-baseline-official-baseline-autodl"
denoise_s = 121.4198
decode_s = 5.8017
total_s = 130.41

[env]
SOL_LTX_INFER_ROOT = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/Sol-LTX-Infer"
# PYTHON_BIN is deliberately absent: the launch body derives it as
# $SOL_LTX_INFER_ROOT/.conda/ltx23/bin/python. Pinning it here as well made the
# pair separable, and they came apart -- on a cluster whose checkout is at a
# different path, overriding SOL_LTX_INFER_ROOT alone left the interpreter
# pointing into the old root and the run died in 19s on a missing python.
# Override SOL_LTX_INFER_ROOT alone; set PYTHON_BIN only to use an interpreter
# that is genuinely not the one inside that checkout.
WARMUP = "true"
COSMOS3_CACHE = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/.cache/cosmos3"
HF_HOME = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/.cache/huggingface"
HF_HUB_CACHE = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/.cache/huggingface/hub"
HF_HUB_OFFLINE = "1"
MODEL_REPO = "nvidia/Cosmos3-Super"
NUM_GPUS = "4"
SEED = "42"
# Prompts are versioned as files rather than inlined here, so the two arms
# cannot drift apart and a run's prompt is diffable. The former inline PROMPT
# is now models/cosmos3/prompts/default.txt verbatim.
PROMPT_FILE = "models/cosmos3/prompts/default.txt"
NEGATIVE_PROMPT_FILE = "models/cosmos3/prompts/negative.txt"

# Per-seam wiring status. Config dry-run checks use manifest-declared
# capabilities; real GPU usefulness still depends on the runtime consuming the
# corresponding env/config/path in Cosmos3 code.
[seam_status]
blocks = "wired"                 # get_blocks -> Cosmos3OmniTransformer.gen_layers
prunable_tokens = "declared"     # prunable_segment defaults to whole seq; refine to video-token span
swappable_attention = "declared"     # seam exists (supported_attention_backends->gen_layers); piecewise kernel+component-map = GPU-validated
residual_tuple = "todo"
ffn_precision = "partial"       # KWL-style fused pieces are partly baseline; online NVFP4 has GPU evidence but remains speed/backend limited
teacache_signal = "wired"        # cosmos3video.forward stashes time_embed under ctx.scratch[("teacache_signal", "step_pred")]; cosmos3.py denoise sets/clears self.transformer._efficiency_scratch around each step
