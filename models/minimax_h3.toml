note_lossless_caveat = "Called lossless on the strength of its math — nothing is skipped or approximated — but the outputs have never been compared against the single-GPU baseline. The all-to-all changes reduction order, and the fusion line showed that on a 49-step trajectory any change in rounding diverges the sample completely (max_abs 255) even when it improves accuracy. Until that comparison is run, 'lossless' here means exact arithmetic, not identical output."
