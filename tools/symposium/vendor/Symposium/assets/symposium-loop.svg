<svg viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Symposium Socratic convergence loop</title>
  <desc id="desc">A vague input flows through Socrates, becomes Seed versions, and stops when ontology similarity reaches 0.85.</desc>
  <rect width="1080" height="420" fill="#fbfaf5"/>

  <path d="M 75 160 Q 75 58 390 58 Q 770 58 770 178" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polygon points="69,160 75,170 81,160" fill="#111"/>
  <text x="430" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111" font-weight="600">Ralph-style convergence loop</text>

  <circle cx="75" cy="230" r="46" fill="#fbfaf5" stroke="#111" stroke-width="1.2"/>
  <text x="75" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#111">vague</text>
  <text x="75" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#111">input</text>

  <line x1="121" y1="230" x2="190" y2="230" stroke="#111" stroke-width="1.2"/>
  <polygon points="188,224 198,230 188,236" fill="#111"/>

  <rect x="200" y="160" width="455" height="140" fill="#ebe7da" stroke="#111" stroke-width="1.2" rx="6"/>
  <text x="215" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111" letter-spacing="0.22em" font-weight="700">SOCRATES</text>

  <g>
    <rect x="215" y="210" width="100" height="54" fill="#fbfaf5" stroke="#111" stroke-width="1" rx="3"/>
    <text x="265" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#111">wonder</text>

    <rect x="325" y="210" width="100" height="54" fill="#fbfaf5" stroke="#111" stroke-width="1" rx="3"/>
    <text x="375" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#111">reflect</text>

    <rect x="435" y="210" width="100" height="54" fill="#fbfaf5" stroke="#111" stroke-width="1" rx="3"/>
    <text x="485" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#111">refine</text>

    <rect x="545" y="210" width="100" height="54" fill="#fbfaf5" stroke="#111" stroke-width="1" rx="3"/>
    <text x="595" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#111">restate</text>
  </g>

  <text x="427" y="286" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5a5a56">shared meaning becomes a Seed</text>

  <line x1="655" y1="230" x2="720" y2="230" stroke="#111" stroke-width="1.2"/>
  <polygon points="718,224 728,230 718,236" fill="#111"/>

  <text x="795" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111" letter-spacing="0.24em" font-weight="700">SEEDS</text>

  <rect x="730" y="142" width="130" height="62" fill="#fbfaf5" stroke="#111" stroke-width="1.4" rx="3"/>
  <text x="795" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Seed v1</text>

  <rect x="730" y="224" width="130" height="62" fill="#fbfaf5" stroke="#111" stroke-width="1.4" rx="3"/>
  <text x="795" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#111">Seed v2</text>
  <text x="795" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5a5a56">...</text>

  <text x="995" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111" letter-spacing="0.24em" font-weight="700">STOP RULE</text>

  <line x1="860" y1="173" x2="950" y2="228" stroke="#111" stroke-width="1.2"/>
  <line x1="860" y1="255" x2="950" y2="232" stroke="#111" stroke-width="1.2"/>

  <circle cx="995" cy="230" r="52" fill="#ebe7da" stroke="#111" stroke-width="1.4"/>
  <text x="995" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#111" font-weight="600">ontology</text>
  <text x="995" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2c2c2a">similarity</text>

  <text x="995" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#111" font-weight="600">≥ 0.85</text>
  <text x="995" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2c2c2a">stop</text>
</svg>
