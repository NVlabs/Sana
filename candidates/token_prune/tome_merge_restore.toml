kind = "methodology"
purpose = "frontier"
description = "ToMe-style balanced bipartite token merge/unmerge with full-shape restoration."
model_profile = "cosmos3"

[id]
name = "tome_merge_restore"
dimension = "token_prune"
family = "tome_merge_restore"

[references.external]
paper = "ToMe: https://github.com/facebookresearch/tome"
code = "ToMeSD: https://github.com/dbolya/tomesd"
notes = "Implements the public ToMe balanced bipartite merge/unmerge core; does not claim the full ToMeSD random-2D diffusion integration."

[references.local]
generic_impl = "techniques/methods/token_prune.py"
model_adapter_example = "snippets/sol-ltx-infer-reference.md"
runtime_example = "snippets/sol-ltx-infer-reference.md"

[requirements]
capabilities = ["has_token_sequence_axis", "has_spatiotemporal_token_layout", "supports_token_gather_scatter"]

[adapter]
model_spec = "Cosmos3"

[efficiency]
kind = "runtime_technique"
name = "token_prune"

[efficiency.params]
keep_ratio = 0.8
method = "tome_merge_restore"
compensation = "prev"

[env]
SGLANG_HQ_CANDIDATE_ID = "tome_merge_restore"
SGLANG_HQ_TOKEN_PRUNE_KEEP_RATIO = "0.8"
SGLANG_HQ_TOKEN_PRUNE_METHOD = "tome_merge_restore"
SGLANG_HQ_TOKEN_PRUNE_COMP = "prev"
SGLANG_HQ_TOKEN_PRUNE_STEPS = "1-2"

[verification]
mode = "gpu"
allow_non_bit_exact = true
quality_gate = "baseline-comparable"
