id = "nvfp4_ffn"
kind = "methodology"
description = "TE NVFP4 FFN quantization methodology for Cosmos3-Super, ported from the LTX-2.3 reference recipe."
submodule = "Sol-LTX-Infer"
base_commit = "29d0d9e464000a2472345dcad51054b15aacca8d"
run_script = "scripts/run_cosmos3_sglang.sh"
eval_profile = "evals/profiles/official_video_t2v.toml"

[official_config]
model = "nvidia/Cosmos3-Super"
width = 1280
height = 720
frames = 189
fps = 24
steps = 35
guidance_scale = 6.0
flow_shift = 10.0
max_sequence_length = 4096
seed = 42
num_gpus = 4

[methodology]
loop = "loops/nvfp4_ffn"
efficiency_transform = "efficiency.transforms.nvfp4_ffn.NVFP4FFN"
reference_recipe = "loops/nvfp4_ffn/reference/recipe.sh"
reference_report = "loops/nvfp4_ffn/reference/report.md"
off_identity = "disabled flag must recover baseline path; enabled NVFP4 is lossy and not byte-exact"
requires = [
  "Blackwell GPU with NVFP4 support",
  "TransformerEngine NVFP4 build",
  "Cosmos3 loader wiring for SGLANG_HQ_ENABLE_TE_NVFP4_FFN",
]
quality_required = [
  "outputs/side_by_side.mp4",
  "visual_judge result in outputs/quality.json",
  "PSNR recorded as diagnostic only",
]

[agent]
goal_id = "nvfp4_ffn"
owner = "codex"
root_branch = "codex/nvfp4_ffn"
submodule_branch = "codex/nvfp4_ffn-sol"
interactive_required = true
write_scope = [
  "Sol-LTX-Infer/python/sglang/multimodal_gen/runtime/efficiency/models/cosmos3_spec.py",
  "Sol-LTX-Infer/python/sglang/multimodal_gen/runtime/models/dits/cosmos3video.py",
]

[env]
MODEL_REPO = "nvidia/Cosmos3-Super"
NUM_GPUS = "4"
SEED = "42"
PROMPT = "A serene mountain lake at sunrise, mist rising off the still water, pine trees reflected on the surface, a small wooden boat drifting slowly, cinematic, high detail"
NEGATIVE_PROMPT = ""
SGLANG_HQ_ENABLE_TE_NVFP4_FFN = "1"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
quality = "quality.json"
risk_notes = "risk_notes.md"
collection = "collection.json"
patch_summary = "patch_summary.md"

[slurm]
account = "nvr_elm_llm"
partition = "batch"
nodes = 1
gpus_per_node = 4
cpus_per_task = 64
mem = "0"
time = "04:00:00"
job_name = "autovideo-nvfp4-ffn"
exclusive = true
