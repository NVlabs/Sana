note = """
The packed all-to-all measured 0.953x — a regression — before the pack kernel existed, and that
number is the whole story of this line. Carrying q, k and v in one collective is not what was
missing. What was missing is that expressing a destination-major layout in PyTorch costs a
torch.stack plus a five-dimensional permute().contiguous(): two full passes over the QKV buffer
before a single byte leaves the GPU. SGLang writes that layout with one kernel that reads q, k and
v through their own strides. Porting it moved the same configuration from 0.953x to 1.115x.
"""

