id = "wan21_fullstack_sol"
kind = "patch"
purpose = "optimization"
description = "Wan2.1-T2V-1.3B full optimization: regional compile, EasyCache, and released Sol-Attn at tau 1.0 with global Morton3D order and dense guards."
model_profile = "wan21_t2v_1_3b"

[runtime]
root = "models/wan21_t2v_1_3b/optimized"

[env]
WAN22_KERNEL_STACK = "regional_compile"
WAN22_KERNEL_LEDGER = "1"
WAN22_COMPILE_MODE = "max-autotune-no-cudagraphs"
WAN22_COMPILE_FULLGRAPH = "0"
WAN22_CACHE_FAMILY = "easycache"
WAN22_EASYCACHE_THRESHOLD = "0.036"
WAN22_SOL_ATTN = "1"
WAN22_SOL_TAU = "1.0"
WAN22_SOL_THRESH_TYPE = "diag"
WAN22_SOL_KV_SPLITS = "auto"
WAN22_SOL_DENSE_STEPS = "10"
WAN22_SOL_DENSE_LAYERS = "0"
WAN22_SOL_REORDER = "1"
TORCHINDUCTOR_CACHE_DIR = "${OUT_DIR}/.cache/torch_inductor"
TRITON_CACHE_DIR = "${OUT_DIR}/.cache/triton"
TORCH_HOME = "${OUT_DIR}/.cache/torch"
XDG_CACHE_HOME = "${OUT_DIR}/.cache/xdg"
TMPDIR = "${OUT_DIR}/.cache/tmp"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
