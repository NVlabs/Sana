schema_version = 1
id = "bernini"
display_name = "Bernini T2V 480p81 pristine baseline (Bernini-Diffusers)"
legacy_profile = "models/bernini.toml"
contract_kind = "model_baseline_minimal_copy"

[baseline]
manifest = "candidates/bernini_baseline.toml"
runtime_root = "runtime/bernini_baseline"
eval_profile = "evals/profiles/official_video_t2v_bernini.toml"
description = "Full-Bernini t2v baseline. The runnable code is vendored in runtime/bernini_baseline/bernini_src (clean copy of the upstream pristine tree); weights + third-party libs are referenced read-only by absolute path."

# Minimal runnable closure copied into an experiment worktree. The vendored
# Bernini code (runtime/bernini_baseline/bernini_src/**) IS copied so experiment
# worktrees have an editable, self-contained tree. Model weights + vendored deps
# are NOT copied (huge, neutral) -- they are referenced by absolute path from
# models/bernini.toml.
[baseline.copy]
paths_are_repo_relative = true
include = [
  "models/bernini.toml",
  "models/bernini/**",
  "runtime/bernini_baseline/**",
  "candidates/bernini_baseline.toml",
  "candidates/schema.md",
  "evals/profiles/official_video_t2v_bernini.toml",
  "evals/rubrics/gemini_visual_artifact_gate.md",
  "evals/tiers.toml",
  "scripts/launch_candidate.py",
  "scripts/collect_run.py",
  "search/plan_eval.py",
  "tools/vision/README.md",
  "tools/vision/lpips_judge.py",
  "tools/vision/nvidia_gemini_judge.py",
  "efficiency/candidate_manifest.py",
]
exclude = [
  ".git/**",
  "**/__pycache__/**",
  "runs/**",
  "output/**",
  "workflow/**",
  "search_space/**",
]

[[baseline.reference_only]]
name = "bernini_diffusers_weights"
path = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/Bernini/ByteDance/Bernini-Diffusers"
repo = "ByteDance/Bernini-Diffusers"
repo_type = "model"
reason = "~192G full Bernini weights (planner + Wan2.2 renderer + VAE + T5); passed to --config by absolute path. Neutral, never copied."

[[baseline.reference_only]]
name = "bernini_vendored_deps"
path = "/lustre/fs1/portfolios/nvr/projects/nvr_elm_llm/users/yitongl/code/Bernini/.gpu-site"
repo_type = "python_libs"
reason = "Vendored third-party python libs (.gpu-site / .gpu-site-pure: torch/diffusers/etc.) on PYTHONPATH via BERNINI_DEPS. Neutral, never copied."

[experiment_defaults]
worktree_mode = "model_baseline_minimal_copy"
experiments_root = "output/experiments"
state_dir = "state"
runs_dir = "runs"
logs_dir = "logs"
caches = ["tmp", "triton", "torch_extensions"]
