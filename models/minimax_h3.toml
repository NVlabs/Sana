note = "The shipped line runs at Ulysses8 over two nodes in one rack, where the NCCL MNNVL path keeps the cross-node all-to-all on NVLink (503 GB/s, above the 486 GB/s of the 4-GPU intra-node case). The [slurm] block below is the single-node baseline allocation; the optimized candidates request two nodes."

