# Search dimension: KWL operator fusion  (MODEL-AGNOSTIC)
#
# Metadata for the kernel/operator-fusion exploration dimension. Native
# subagents start from search_space/ and inspect the target model inference code
# directly; this file is not a fixed hyperparameter grid.

id = "kwl_fusion"
title = "Quality-gated kernel and operator optimization"
kind = "build_transform"

[[technique]]
name = "kwl_fusions"
search_axes = [
  "hot operator pattern",
  "method family",
  "fusion boundary",
  "kernel implementation choice",
  "microbench scope",
  "compile mode",
  "graph capture mode",
  "layout/copy elimination",
  "launch-overhead reduction",
  "stream overlap",
  "fallback policy",
  "numeric tolerance",
  "warm/cold cache state",
]

[[method_baseline]]
id = "eager_operator_chain_baseline"
family = "module_local_eager_ops"
tier = "wired"
status = "wired"
description = "The current unfused target-model module/operator chain used as the microbench and full-run baseline for exact KWL comparisons."
entrypoint = "runtime/hunyuan_diffusers_baseline transformer block hot path"
required_work = "Use as the OFF/eager reference when measuring module-local KWL candidates; do not replace it with backend selection or dispatch-only probes."

[[method_baseline]]
id = "gemm_epilogue_fusion"
family = "gemm_epilogue_fusion"
tier = "runtime_patch"
status = "not_wired"
description = "Fuse post-GEMM bias, activation, residual, gate, or output layout work into a custom or library GEMM epilogue."
entrypoint = "Sol-LTX-Infer hot linear/GEMM path"
required_work = "Patch the library epilogue or custom op path; record tolerance class, tensor diffs when practical, and aligned quality evidence."

[[method_baseline]]
id = "attention_adjacent_dense_fusion"
family = "attention_adjacent_dense_fusion"
tier = "runtime_patch"
status = "not_wired"
description = "Fuse dense-attention-adjacent projection output handling, norm, RoPE/layout, split/projection, or mask metadata work without changing attention semantics."
entrypoint = "Sol-LTX-Infer attention module path"
required_work = "Patch module-local operators or custom wrappers; prove same dense masks, token order, dtype contract, and tensor outputs within declared tolerance."

[[method_baseline]]
id = "norm_modulation_residual_fusion"
family = "norm_modulation_residual_fusion"
tier = "runtime_patch"
status = "not_wired"
description = "Fuse RMSNorm/LayerNorm, AdaLN modulation, residual, scale/shift, or gate chains around transformer blocks."
entrypoint = "Sol-LTX-Infer block elementwise path"
required_work = "Patch fused elementwise path; prove semantic boundary and record warm timing versus launch count."

[[method_baseline]]
id = "compile_graph_capture"
family = "compile_or_cuda_graph"
tier = "runtime_patch"
status = "not_wired"
description = "Use Torch compile, regional compile, graph-break repair, or CUDA graph replay for stable repeated regions."
entrypoint = "Sol-LTX-Infer denoising/block execution path"
required_work = "Use only after module-local kernel candidates are exhausted; patch compile/capture boundaries; separate cold compile, warm compile, graph replay, and fallback timings."

[[method_baseline]]
id = "layout_copy_elimination"
family = "layout_copy_elimination"
tier = "runtime_patch"
status = "not_wired"
description = "Remove redundant contiguous, reshape, permute, dtype, allocation, or copy churn from hot paths."
entrypoint = "Sol-LTX-Infer tensor layout path"
required_work = "Patch the live path; prove aliasing/in-place safety and measure copy-kernel reduction."

[eval]
profile = "evals/profiles/official_video_t2v.toml"
min_speedup_for_experimental = 1.03
min_speedup_for_promotion = 1.10

[loop]
granularity = "per_strategy"                       # axis this dimension searches: per_step | per_module | per_strategy
objective = ["min_latency", "min_peak_mem"]  # improvement vs models/<id>.toml [baseline]; either counts
max_iters = 40                           # search budget per dimension (hyperparameter)
early_stop_patience = 0                  # fixed-budget frontier mode; 0 disables patience early stop
keep = "frontier_candidates"             # keep candidates that improve quality OR speed/memory
tiers = "evals/tiers.toml"               # speed targets: low=1.5x, medium=2.0x, high=3.0x
# KWL follows fixed-budget frontier retention over module/kernel microbench
# evidence first: retain candidates that improve warm microbench latency or
# peak memory with acceptable tensor diff and OFF identity. Full denoising is
# final validation only after microbench success. Reject backend-selection,
# SDPA-backend, framework-dispatch, or env-flag-only probes; stale local
# backend-selection records must not be resumed.
# Structured-negative is logged as a proposal/failure signature; it does not stop this default loop.
# After the loop, the main agent selects 1.5x/2.0x/3.0x winners by Gemini+LPIPS quality ranking.
