[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sana-robot"
version = "0.1.0"
description = "SANA-Robot"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch==2.9.1",
    "flash-attn==2.8.3.post1",
    "accelerate==1.14.0",
    "diffusers==0.39.0",
    "transformers==5.5.0",
    "pyrallis==0.3.1",
    "safetensors==0.8.0",
    "numpy==2.4.4",
    "av==18.0.0",
    "opencv-python==5.0.0.93",
    "pillow==13.0.0",
    "pyarrow==24.0.0",
    "wandb==0.25.0",
    "nvidia-cutlass-dsl==4.5.3",
    "cuda-python==12.9.4",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
known_third_party = ["wandb"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
known_first_party = ["sana_robot"]

[tool.setuptools.packages.find]
include = ["sana_robot*"]

[tool.setuptools.package-data]
"sana_robot.kernels.inference.ops.nvfp4" = ["csrc/*/*.cu", "csrc/*/*.cuh"]
