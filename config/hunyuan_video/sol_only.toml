id = "hunyuan_video_sol_only"
kind = "patch"
purpose = "optimization"
description = "HunyuanVideo-13B Sol-Attn only: released SM90/SM100 CuTe DSL kernel at tau 1.0 with exact text KV sink and dense text queries. No compile or cache; one warmup pass excludes kernel compilation."
model_profile = "hunyuan_video"

[runtime]
root = "models/hunyuan_video/optimized"

[env]
HUNYUAN_SOL_ATTN = "1"
HUNYUAN_SOL_TAU = "1.0"
HUNYUAN_SOL_THRESH_TYPE = "diag"
HUNYUAN_SOL_KV_SPLITS = "auto"
HUNYUAN_SOL_MORTON = "0"
HUNYUAN_WARMUP_PASSES = "1"
TORCHINDUCTOR_CACHE_DIR = "${OUT_DIR}/.cache/torch_inductor"
TRITON_CACHE_DIR = "${OUT_DIR}/.cache/triton"
TORCH_HOME = "${OUT_DIR}/.cache/torch"
XDG_CACHE_HOME = "${OUT_DIR}/.cache/xdg"
TMPDIR = "${OUT_DIR}/.cache/tmp"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
