id = "kwl_fusion"
kind = "env_only"
description = "Cosmos3 KWL operator-fusion env bundle modeled on LTX-2.3."
submodule = "Sol-LTX-Infer"
base_commit = "3a69b7788a055bed728ec367961c5f25b4ab48dc"
run_script = "scripts/run_cosmos3_sglang.sh"
eval_profile = "evals/profiles/official_video_t2v.toml"

[official_config]
model = "nvidia/Cosmos3-Super"
width = 1280
height = 720
frames = 189
fps = 24
steps = 35
guidance_scale = 6.0
flow_shift = 10.0
max_sequence_length = 4096
seed = 42
num_gpus = 4

[agent]
goal_id = "kwl_fusion"
owner = "codex"
root_branch = "codex/kwl_fusion"
submodule_branch = "codex/kwl_fusion-sol"
interactive_required = true
write_scope = [
  "Sol-LTX-Infer/python/sglang/multimodal_gen/runtime/efficiency/models/cosmos3_spec.py",
  "Sol-LTX-Infer/python/sglang/multimodal_gen/runtime/models/dits/cosmos3video.py",
]

[env]
MODEL_REPO = "nvidia/Cosmos3-Super"
NUM_GPUS = "4"
SEED = "42"
PROMPT = "A serene mountain lake at sunrise, mist rising off the still water, pine trees reflected on the surface, a small wooden boat drifting slowly, cinematic, high detail"
NEGATIVE_PROMPT = ""
SGLANG_HQ_KWL_SHARE_BLOCK0_SELF_ATTN = "1"
SGLANG_HQ_KWL_SHARE_GUIDANCE_PREFIX = "1"
SGLANG_HQ_KWL_FUSED_QK_ROPE = "1"
SGLANG_HQ_KWL_FUSED_RMS_ADALN = "1"
SGLANG_HQ_KWL_FUSED_ADALN = "1"
SGLANG_HQ_KWL_FUSED_QKNORM_ROPE = "1"
SGLANG_HQ_KWL_FUSED_DUAL_MODULATE = "1"
SGLANG_HQ_KWL_FUSED_CA_DUAL_MODULATE = "1"
SGLANG_HQ_KWL_FUSED_ADA_VALUES_ALL = "1"
SGLANG_HQ_KWL_FUSED_RESIDUAL_GATE = "1"
SGLANG_HQ_KWL_FUSED_FFN_PROJ_IN_GELU = "1"
SGLANG_HQ_KWL_COMPILE_GATE_TO_OUT = "1"
SGLANG_HQ_KWL_FUSED_AUDIO_QKVG = "1"
SGLANG_HQ_KWL_ENABLE_FUSED_QKNORM_ROPE = "1"
SGLANG_HQ_KWL_COMPILE_TILED_VAE = "1"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
quality = "quality.json"
risk_notes = "risk_notes.md"
collection = "collection.json"
patch_summary = "patch_summary.md"

[slurm]
account = "nvr_elm_llm"
partition = "batch"
nodes = 1
gpus_per_node = 4
cpus_per_task = 64
mem = "0"
time = "04:00:00"
job_name = "autovideo-kwl-fusion"
exclusive = true
