name = "full_diffusion_eval"
kind = "agent_callable"
callable_by = ["codex_executor"]
description = "Launch or collect the official full Sana Video diffusion run for each cache candidate."

inputs = ["candidate_id", "candidate_manifest", "fixed_sana_eval_contract"]
outputs = ["runs/<run_id>/outputs/benchmark.json", "runs/<run_id>/outputs/frames", "runs/<run_id>/outputs/out.mp4"]
outcomes = ["submitted", "completed", "failed", "infra_blocked"]
required_artifacts = ["outputs/benchmark.json", "outputs/frames or outputs/out.mp4"]
