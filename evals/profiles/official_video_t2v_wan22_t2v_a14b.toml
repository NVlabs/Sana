id = "official_video_t2v_wan22_t2v_a14b"
description = "Wan2.2-T2V-A14B 720p81 text-to-video evaluation profile (vanilla diffusers WanPipeline MoE, single GB200 GPU)."

[official_config]
model = "wan22_t2v_a14b_diffusers"
width = 1280
height = 720
frames = 81
fps = 16
steps = 40
flow_shift = 12.0
guidance_mode = "cfg_moe"
guidance_scale = 4.0
guidance_scale_2 = 3.0
seed = 1024
num_gpus = 4

[artifacts]
required = [
  "outputs/run.log",
  "outputs/out.mp4",
  "outputs/benchmark.json",
]
optional = [
  "outputs/videos",
  "outputs/frames",
  "outputs/run_config.json",
  "outputs/quality.json",
]

[performance]
baseline_candidate = "wan22_t2v_a14b_baseline"
primary_metric = "total_s"
secondary_metric = "denoise_s"
min_speedup_for_experimental = 1.03
min_speedup_for_promotion = 1.10
warmup_required_for_promotion = true
record_compile_cache_state = true
baseline_total_s_single_prompt = 451.48

[off_identity]
required_for_kinds = ["patch", "methodology"]
same_seed_required = true
same_prompt_required = true
same_official_config_required = true
notes = "Baseline is the exact vanilla diffusers WanPipeline MoE reference (dual guidance 4.0/3.0, flow_shift 12); optimizations must recover it when disabled. A14B is officially multi-GPU; single-GPU baseline here."

[quantitative_quality]
enabled = true
metrics = [
  "frame_count",
  "duration_s",
  "mean_abs_pixel_diff",
  "mse",
  "psnr",
  "sharpness_ratio",
  "temporal_delta_error",
  "temporal_jitter_ratio",
]
frame_count_expected = 81
duration_tolerance_s = 0.25
sharpness_ratio_min = 0.95
sharpness_ratio_max = 1.08

[visual_artifact]
enabled = false
notes = "Codex built-in multimodal frame review used for the visual gate; enable a provider here to wire an automated gate."
