family = "video_t2va"
submodule = "models/minimax_h3/baseline"
run_script = "models/minimax_h3/baseline/scripts/run_minimax_h3_gpu.sh"
eval_profile = "evals/profiles/official_video_t2va_minimax_h3.toml"

# MiniMax-H3 is a joint audio+video generator: one 33B dense single-stream transformer denoises a
# single packed sequence carrying text conditioning, video latent rows and audio latent rows, with
# full self-attention over all of it. There is no vocoder and no post-hoc audio pass. The released
# checkpoint is guidance-distilled, so there is no CFG: one forward pass per step, no
# guidance_scale, no negative prompt.
#
# The two released partitions (FL2VA, Ref2VA) differ only in transformer weights. Only FL2VA is
# converted here; it serves t2va and fl2va, and MiniMaxH3Blocks never touches transformer_ref/.
#
# The model natively supports sparse attention, but the initial open-source release ships inference
# with full attention only — the vendor states the sparse implementation lands later. That is the
# obvious opening for SOL Attention / PISA.

[official_config]
model = "MiniMaxAI/MiniMax-H3"
revision = "9d710aedb174fa4448fcdeeb9a542f11ab52209a"
partition = "fl2va"
task = "t2va"
width = 1344
height = 768
frames = 124
fps = 24
duration_s = 5.167
steps = 50
flow_shift = 12.0
audio_flow_shift = 3.0
audio_sample_rate = 32000
audio_channels = 2
seed = 0
num_gpus = 4
context_parallel_degree = 1
transformer_dtype = "bf16"
text_encoder_dtype = "bf16"
vae_dtype = "bf16"
guidance_distilled = true
# Workload is the published SGLang MiniMax-H3 benchmark cell, so these numbers are directly
# comparable to the vendor table (8xB300 BF16 FL2VA: 19.04 s, 83,578 MB peak/GPU with Ulysses-8).

[architecture]
transformer_params = "33B dense single-stream"
transformer_layers = 50
hidden_size = 5376
num_attention_heads = 56
attention_head_dim = 128
ffn_dim = 14336
patch_size = [1, 2, 2]
latents_dim = 24
audio_latents_dim = 32
rope = "3D MM-RoPE over (t, h, w)"
text_encoder = "Qwen3-VL-32B, hidden states read at decoder layer 50, lm_head unused"
video_vae = "f16t4d24 causal video autoencoder, ViT decoder"
audio_vae = "32 kHz stereo, per-channel shared encoder/decoder, 40 Hz latent"
note = "~13B of the 33B lives in AdaLN branches whose modulation outputs can be precomputed and cached, so inference-only deployment need not load them. Not exploited by the baseline."

